<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <script src="/js/lang-path.js?v=20261109A"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>关于 Snow Yuzu · 小柚的小世界</title>
  <meta name="description" content="Snow Yuzu 的所有社交平台与联系方式：Gmail、Instagram、X、Discord、微信、抖音、小红书、网易云音乐">
  <link rel="icon" type="image/png" sizes="180x180" href="/icon-yuki2-180.png">
  <link rel="stylesheet" href="/css/site.css?v=20261107H">
  <link rel="stylesheet" href="/site-menu.css?v=20261105C">
  <script src="/js/site-common.js?v=20261107H"></script>
  <script src="/site-menu.js?v=20261105C" defer></script>
  <style>
    /* §3.3：找到我改为纵向文字链接列表，不再使用大型卡片网格 */
    #links { max-width: none; }
    #links .sy-linkline { display: block; padding: 13px 4px; border-bottom: 1px solid var(--accent,#F9E5ED); color: var(--text,#65515D); font-size:17px; text-decoration: none; transition: color .2s, padding-left .2s; }
    #links .sy-linkline:hover { color: var(--price,#F48FB1); padding-left: 10px; }
    #links .sy-linkline:first-child { border-top: 1px solid var(--accent,#F9E5ED); }
  </style>
  <style>
    /* ═══ 她 20261108 21:58 任务书：About 页重设计 ═══
       ① 社交卡：每个联系方式独立白卡（覆盖 social-cards.js 共享的 #FFF8FA 底）
       ② Keycap Shopping Notes：每板块独立白卡（about 页此前无 pol-card 样式，板块是裸文字）
       配色：页面 #FFF8FA · 卡 #FFFFFF · 边 #F9E5ED · 主字 #65515D · 次字 #897783 */
    /* —— 社交卡（白底 + 浅粉细边框；仅本页覆盖，不影响其他页） —— */
    #links { max-width: 1200px; margin: 0 auto; padding: 0 24px; box-sizing: border-box; }
    #links .sy-rowlist { gap: 14px 16px; }
    #links .sy-rowcard { background: #FFFFFF !important; border: 1.5px solid #F9E5ED !important; border-radius: 16px; padding: 16px 18px; }
    #links a.sy-rowcard:hover { background: #FCECF2 !important; border-color: #F6C5D7 !important; }
    /* —— Keycap Shopping Notes 卡片化 —— */
    #keycap-notes { display: flex; flex-direction: column; gap: 16px; }
    .keycap-notes-title { font-size: 24px; color: #65515D; margin: 6px 0 18px; letter-spacing: .5px; font-weight: 700; }
    .pol-sec { background: #FFFFFF; border: 1.5px solid #F9E5ED; border-radius: 16px; padding: 20px 22px; }
    .keycap-h3 { font-size: 19px; font-weight: 700; color: #65515D; margin: 0 0 10px; letter-spacing: .3px; }
    .pol-sec p { font-size: 17px; line-height: 1.75; color: #65515D; margin: 0 0 10px; }
    .pol-sec p:last-child { margin-bottom: 0; }
    @media (max-width: 640px) {
      #links { padding: 0 14px; }
      .pol-sec { padding: 16px 15px; border-radius: 14px; }
      .keycap-notes-title { font-size: 21px; }
    }
  </style>
  <link rel="stylesheet" href="/css/button-theme.css?v=20261107H">
  <script src="/js/policy-content.js?v=20261108A"></script>
</head>
<body>

<!-- 顶部白色长条：左边切换语言，中间 logo 点击回主页，右边菜单（与全站子页面同一套） -->
<header class="topbar">
  <div class="lang-switch">
    <button class="lang-btn" data-lang="zh">简体中文</button>
    <button class="lang-btn" data-lang="en">English</button>
  </div>
  <a class="site-logo" href="/" aria-label="回主页"><img src="/logo.png" alt="logo"></a>
  <div class="topbar-right">
    <a class="topbar-cart" id="topbar-cart" href="/shop/?sec=cart" aria-label="购物车">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2.5 3.5h2.2l2.3 11.2a1.8 1.8 0 0 0 1.8 1.4h8.5a1.8 1.8 0 0 0 1.8-1.4l1.5-8.2H6"/></svg>
      <span class="topbar-cart-badge" id="topbar-cart-badge" style="display:none;">0</span>
    </a>
    <button class="burger" id="burger" aria-label="菜单">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
<div class="menu-mask" id="menu-mask"></div>
<nav class="menu" id="menu"></nav>

<div class="subpage-header">
    <h1 class="subpage-title" data-zh="关于 Snow Yuzu" data-en="About Snow Yuzu">关于 Snow Yuzu</h1>
    <p class="subpage-sub" data-zh="找到我 · 各平台的账号都在这里" data-en="Find me · all my accounts are here">找到我 · 各平台的账号都在这里</p>
  </div>
  <a class="back-link page-back" href="/" style="margin:8px 0 24px 2px;"><span data-zh="← 返回主页" data-en="← Back to Home">← 返回主页</span></a>

  <div class="page-body" style="padding-top:6px;">
    <section id="links">
      <div class="links" id="about-links"></div>
    </section>
  </div>
  <section style="max-width:1200px;margin:0 auto;padding:0 20px 48px;">
    <div id="keycap-notes"></div>
  </section>

<footer></footer>
  <script src="/js/social-cards.js?v=20261105C"></script>
  <script src="/js/site-footer.js?v=20261105C"></script>
  <script>
    renderSocialCards('#about-links','row');
    if (window.renderSiteFooter) renderSiteFooter();
      // §1.3 语言状态初始化：刷新/跳转后恢复 yuki-lang 选中态并翻译静态文案（此前四页漏调，语言按钮无选中态）
    if (typeof applyLang === 'function') applyLang((function(){try{return localStorage.getItem('yuki-lang')||'zh';}catch(e){return 'zh';}})());
</script>
</body>
</html>

<script>document.addEventListener("DOMContentLoaded", function(){ if (window.renderKeycapNotes) window.renderKeycapNotes("keycap-notes"); });</script>
