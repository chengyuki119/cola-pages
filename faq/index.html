<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>常见问题 FAQ · Snow Yuzu</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="/icon-yuki2-180.png">
<link rel="icon" type="image/png" sizes="180x180" href="/icon-yuki2-180.png">
<meta name="apple-mobile-web-app-title" content="小柚的小世界">
<link rel="stylesheet" href="/css/site.css?v=20261028p18">
<link rel="stylesheet" href="/site-menu.css?v=20261028p18">
<script src="/site-menu.js?v=20261028p18" defer></script>
<style>
  .policy-wrap { max-width: 1000px; margin: 0 auto; padding: 48px 24px 64px; }
  .policy-updated { color: var(--muted,#A88E9B); font-size: 15px; margin: 0 0 18px; }
  .faq-list { display: flex; flex-direction: column; gap: 12px; }
  .faq-item { background: #fff; border-radius: 16px; box-shadow: 0 2px 10px rgba(180,120,150,.12); overflow: hidden; }
  .faq-q {
    width: 100%; display: block; text-align: left;
    border: none; background: transparent; cursor: pointer;
    padding: 14px 16px; font-family: inherit;
    color: var(--text,#604C57);
  }
  .faq-q:hover { background: var(--accent-soft,#FCE4EC); }
  .faq-q-en { display: block; font-size: 17px; line-height: 1.5; font-weight: 700; }
  .faq-q-zh { display: block; font-size: 16px; line-height: 1.5; color: var(--muted,#A88E9B); margin-top: 2px; }
  .faq-arrow { display: block; font-size: 14px; color: var(--accent-soft,#FCE4EC); margin-top: 4px; transition: transform .2s; }
  .faq-item.open .faq-arrow { transform: rotate(180deg); }
  .faq-a { display: none; padding: 0 16px 14px; }
  .faq-a-box { background: var(--accent-soft,#FCE4EC); border-radius: 12px; padding: 12px 14px; }
  .faq-item.open .faq-a { display: block; }
  .faq-a p { font-size: 17px; line-height: 1.7; color: var(--text,#604C57); margin: 0; }
  @media (max-width: 520px) { .policy-wrap { padding: 36px 16px 56px; } }
  /* 统一横幅 header：banner 对齐 policy-wrap 内容列 */
  .subpage-header h1, .subpage-header p { max-width: 1000px; }
</style>
</head>
<body>
<header class="topbar">
  <div class="lang-switch">
    <button class="lang-btn" data-lang="zh">简体中文</button>
    <button class="lang-btn" data-lang="en">English</button>
  </div>
  <a class="site-logo" href="/" aria-label="回主页"><img src="/logo.png" alt="logo"></a>
  <div class="topbar-right">
    <a class="topbar-cart" id="topbar-cart" href="/shop/?sec=cart" aria-label="购物车">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2.5 3.5h2.2l2.3 11.2a1.8 1.8 0 0 0 1.8 1.4h8.5a1.8 1.8 0 0 0 1.8-1.4l1.5-8.2H6"/></svg>
      <span class="topbar-cart-badge" id="topbar-cart-badge" style="display:none;">0</span>
    </a>
    <button class="burger" id="burger" aria-label="菜单">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
<div class="menu-mask" id="menu-mask"></div>
<nav class="menu" id="menu"></nav>

<header class="subpage-header">
<h1 class="subpage-title" data-zh="常见问题" data-en="FAQ">常见问题</h1>
  <p class="policy-updated">最后更新：2026-10-25 · Last updated: 2026-10-25</p>
</header>
<div class="policy-wrap">
    <a class="back-link page-back" href="/" style="margin:8px 0 24px 2px;"><span data-zh="← 返回主页" data-en="← Back to Home">← 返回主页</span></a>
  <div id="policy-content"></div>
</div>

<footer></footer>

<script src="/js/site-common.js?v=20261028p18"></script>
<script src="/js/policy-content.js?v=20261028p18"></script>
<script src="/js/site-footer.js?v=20261028p18"></script>
<script>
  function initFaqPage() {
    window.__policyCurrentKey = 'faq';
    renderPolicyPage('faq');
    renderSiteFooter();
    applyLang(LANG);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initFaqPage);
  else initFaqPage();
</script>
</body>
</html>
