<style>
  /* ===== Millo 字体（测试版） ===== */
h1, h2, .subpage-title { font-family: "Millo Body Heavy", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }

  @font-face { font-family: "Millo Body Heavy"; src: url("/fonts/Millo-RiceSoyMilk90.woff2") format("woff2"), url("/fonts/Millo-RiceSoyMilk90.ttf") format("truetype"); font-display: swap; }
  @font-face { font-family: "Millo Body"; src: url("/fonts/Millo-RiceSoyMilk80.woff2") format("woff2"), url("/fonts/Millo-RiceSoyMilk80.ttf") format("truetype"); font-display: swap; }

  :root {
    --bg: #FFFBFC;
    --card: #FFFFFF;
    --card-hover: #FCE4EC;
    --text: #604C57;
    --muted: #A88E9B;
    --accent: #ffd9e6;
    --accent-soft: #FCE4EC;
    --accent-strong: #A98D96;
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Millo Body", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
    padding-top: 60px; /* 避开固定顶栏 */
  }
  body.lang-en .product.sold::after { content: "Sold"; }

  /* 状态标签：在售 / 仅展示 / 售尽（图片右下角，避开右上角的收藏心形） */
  .st {
    position: absolute;
    top: auto; bottom: 10px; right: 10px;
    font-size:15px;
    padding: 3px 12px;
    border-radius: 999px;
    color: #fff;
  }
  .st-on { background: var(--success,#5FA777); }
  .st-display { background: #b3ace0; }
  .st-out { background: #c4bcb6; }
  .product.off .product-img { filter: grayscale(.7); }
  .no-buy { font-size:16px; color: var(--muted); }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }

  .shop-header {
    background: var(--accent-soft,#FCE4EC);
    padding: 84px 0 40px;
    position: relative;
  }
  .shop-header-inner { max-width: 1200px; margin: 0 auto; padding: 0 24px; } /* 与主页照片页同宽，同一条左边线 */
  .shop-header h1 { font-size:31px; margin: 20px 0 6px; }
  .shop-header p { color: var(--muted); font-size:17px; }
  .back-link {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--text);
    font-size:17px;
    padding: 8px 14px;
    border-radius: 999px;
    background: var(--card);
    transition: background .2s;
  }
  .back-link:hover { background: var(--card-hover); }

  /* ===== 独立账号页：分组侧栏面板（同柚子专属后台的交互风格） ===== */
  #acc-shell { display: flex; gap: 18px; align-items: flex-start; }
  #acc-menu {
    width: 230px; flex-shrink: 0;
    background: #fff; border-radius: var(--radius);
    padding: 14px; position: sticky; top: 74px;
  }
  #acc-views { flex: 1; min-width: 0; }
  .acc-group + .acc-group { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--card-hover, #FCE4EC); }
  .acc-group-title { font-size: 13px; color: var(--muted); padding: 4px 10px 8px; }
  .acc-item {
    display: block; width: 100%; text-align: left; border: none;
    background: none; font-size: 17px; color: var(--text);
    padding: 10px 12px; border-radius: 12px; cursor: pointer;
    font-family: inherit; transition: background .15s;
  }
  .acc-item:hover { background: var(--card, #FFFFFF); }
  .acc-item.on { background: var(--accent-soft,#FCE4EC); color: var(--accent-strong); font-weight: 600; }
  .acc-logout {
    display: block; width: 100%; text-align: center; border: none;
    background: var(--accent,#ffd9e6); color: var(--text, #604C57); font-size: 16px; font-weight: 600;
    padding: 11px 12px; border-radius: 12px; cursor: pointer; font-family: inherit;
    transition: background .15s;
  }
  .acc-logout:hover { background: var(--accent-soft,#FCE4EC); }
  @media (max-width: 760px) {
    #acc-shell { flex-direction: column; }
    #acc-menu { width: 100%; position: static; display: flex; flex-wrap: wrap; gap: 4px; padding: 10px; }
    .acc-group { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
    .acc-group + .acc-group { margin-top: 0; padding-top: 0; border-top: none; margin-left: 10px; }
    .acc-group-title { width: 100%; padding-bottom: 2px; }
    .acc-item { width: auto; }
    .acc-logout { width: auto; padding: 10px 22px; }
  }

  .shop-body {
    max-width: 1200px;
    margin: 0 auto;
    padding: 12px 24px 72px;
  }
  .notice {
    background: var(--card);
    border-radius: var(--radius);
    padding: 14px 18px;
    font-size:17px;
    color: var(--muted);
    margin-bottom: 28px;
  }
  .notice b { color: var(--text); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
  }
  @media (max-width: 640px) { .grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; } } /* 手机上跟色卡同宽，一行能排四个 */
  .product {
    background: #fff;
    border: 1px solid #F3DDE5; /* 20261026r 商品卡描框（与 site.css r 轮规则同一套；本页不加载 site.css，故此处声明） */
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 2px 14px rgba(255,143,171,.12);
    transition: transform .2s, box-shadow .2s;
    position: relative;
    display: flex; flex-direction: column;
  }
  .product:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(255,143,171,.20); }
  .product-img {
    position: relative;
    aspect-ratio: 1;
    background: var(--accent-soft,#FCE4EC);
    display: flex; align-items: center; justify-content: center;
    font-size:61px;
    overflow: hidden;
  }
  .product-img img { width: 100%; height: 100%; object-fit: cover; }
  .product-img .pg-img { object-fit: cover !important; } /* 卡片图正方形填满（内联 contain 会留白边，用 !important 压过） */
  .product-info { padding: 14px 16px 16px; flex: 1; display: flex; flex-direction: column; }
  .product-tag {
    align-self: flex-start;
    font-size:14px;
    color:var(--text,#604C57);
    background: var(--accent-soft,#FCE4EC);
    border-radius: 999px;
    padding: 2px 10px;
    margin-bottom: 8px;
  }
  .product-info h3 { font-size:19px; }
  .product-info p { color: var(--muted); font-size:16px; margin: 4px 0 12px; flex: 1; }
  .product-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; row-gap: 8px; }
  .product-row .buy-btn, .product-row .card-edit-btn, .product-row .no-buy, .product-row .price { white-space: nowrap; flex-shrink: 0; }
  .card-edit-btn { border: none; background: var(--card-hover); color:var(--text,#604C57); font-size:14px; cursor: pointer; padding: 4px 12px; border-radius: 999px; font-family: inherit; transition: background .2s, color .2s; white-space: nowrap; }
  .card-edit-btn:hover { background: var(--accent-soft); color: var(--text, #604C57); }
  .price { font-size:21px; font-weight: 700; color:var(--text,#604C57); font-family: "Millo Body", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .price small { font-size:15px; font-weight: 400; }
  .buy-btn {
    border: none;
    background: var(--accent-soft);
    color: var(--accent-strong);
    font-size:16px;
    padding: 8px 18px;
    border-radius: 999px;
    cursor: pointer;
    transition: background .2s;
  }
  .buy-btn:hover { background:var(--accent,#ffd9e6); }


  /* 收藏心心 */
  .fav-btn {
    border: none; background: rgba(255,251,252,.92);
    color:var(--text,#604C57); cursor: pointer;
    font-size: 18px; line-height: 1;
    width: 34px; height: 34px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    transition: transform .15s, background .2s;
    font-family: inherit;
  }
  .fav-btn:hover { transform: scale(1.12); background: var(--accent-soft,#FCE4EC); }
  .product-img .fav-btn { position: absolute; top: 10px; right: 10px; z-index: 2; }
  .product-img { position: relative; }
  .fav-btn.detail-fav { width: 40px; height: 40px; font-size: 22px; vertical-align: middle; margin-left: 8px; }

  /* 售尽 / 仅展示：图片灰化，不放购买按钮 */

  .star { cursor: pointer; font-size:25px; color: #f0c3da; transition: color .15s; }
  .star:hover { color:var(--text,#604C57); }
  .star.on { color:var(--text,#604C57); }

  /* 评价卡：登录了后台才会出现的 ⋮ 管理菜单（删除） */
  .rv-kebab { position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border: none; border-radius: 10px; background: var(--card); color: var(--muted); font-size: 19px; line-height: 1; cursor: pointer; font-family: inherit; }
  .rv-kebab:hover { background: var(--card-hover); color: var(--text); }
  #rv-menu { position: absolute; z-index: 300; display: none; background: #fff; border-radius: 14px; box-shadow: 0 10px 30px rgba(140,100,120,.22); padding: 6px; min-width: 156px; }
  #rv-menu.open { display: block; }
  #rv-menu button { display: block; width: 100%; text-align: left; border: none; background: none; border-radius: 9px; padding: 9px 12px; font-size: 16px; font-family: inherit; color: var(--text); cursor: pointer; }
  #rv-menu button:hover { background: var(--card); }
  #rv-menu .rv-menu-del { background: var(--accent,#FFD9E6); }
  #rv-menu .rv-menu-del:hover { background: var(--accent-soft,#FCE4EC); }

  .toast {
    position: fixed;
    bottom: 32px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: #fff;
    font-size:17px;
    padding: 10px 22px;
    border-radius: 999px;
    opacity: 0;
    transition: opacity .25s, transform .25s;
    z-index: 400;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 付款方式 */
  .pay-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px;
  }
  .pay-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
  }
  .pay-card p { font-size:17px; margin-top: 10px; }
  /* 收款方式：一个按钮 → 点开弹出收款码图 */
  .pay-cta { background: var(--card); border-radius: var(--radius); padding: 18px 16px; text-align: center; }
  .pay-cta p { font-size:17px; color: var(--muted); margin-bottom: 14px; }
  .pay-modal { position: fixed; inset: 0; background: var(--bg); display: none; align-items: center; justify-content: center; z-index: 600; padding: 8px; }
  .pay-modal.open { display: flex; }
  .pay-modal img { max-width: min(98vw, 620px); max-height: 94vh; border-radius: 14px; display: block; box-shadow: 0 12px 40px rgba(120,80,100,.3); }
  .pay-close { position: absolute; top: 16px; right: 16px; width: 38px; height: 38px; border: none; border-radius: 50%; background: var(--card-hover); color: var(--text); font-size: 22px; line-height: 1; cursor: pointer; font-family: inherit; }
  .pay-close:hover { background: var(--card); }
  .pay-img {
    aspect-ratio: 1;
    background: #ffffff;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size:16px;
    text-align: center;
    overflow: hidden;
  }
  .pay-img img { width: 100%; height: 100%; object-fit: contain; }

  footer {
    text-align: center;
    color: var(--muted);
    font-size:15px;
    padding: 24px 0 40px;
  }

  /* ===== 顶部白色长条（与主页一致）===== */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 60px;
    background: #ffffff;
    box-shadow: 0 2px 12px rgba(255,143,171,.18);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
  }
  .lang-switch {
    display: flex;
    gap: 4px;
    background: var(--accent-soft, #FCE4EC); /* 20261026s 她指定款：粉胶囊底座+白胶囊选中（全站同款） */
    padding: 4px;
    border-radius: 999px;
  }
  .lang-btn {
    border: none;
    background: transparent;
    font-size:15px;
    padding: 5px 12px;
    border-radius: 999px;
    cursor: pointer;
    color: var(--muted);
    transition: background .2s, color .2s, box-shadow .2s;
  }
  .lang-btn.active {
    background: #ffffff;
    color: var(--text, #604C57);
    font-weight: 600;
    box-shadow: 0 1px 4px rgba(180,120,150,.28);
  }

  @media (max-width: 400px) {
    .lang-btn { padding: 4px 8px; }
    .topbar { padding: 0 10px; }
  }

h1::after { content: " ♥"; font-size: .75em; }
h2 span[data-zh]::after { content: " ☆"; font-size: .85em; }
/* 多图翻页：与 site.css 同步（大图‹› + 极简圆点 + 底部小图预览） */
.pg-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border-radius: 50%; border: none; background: rgba(255,255,255,.92); color: var(--text); font-size: 16px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(180,120,150,.25); font-family: inherit; padding: 0; }
.pg-prev { left: 8px; }
.pg-next { right: 8px; }
.pg-dots { position: absolute; left: 0; right: 0; bottom: 48px; display: flex; justify-content: center; gap: 4px; pointer-events: none; }
.pg-dot { width: 5px; height: 5px; border-radius: 999px; background: rgba(255,255,255,.88); box-shadow: 0 1px 3px rgba(0,0,0,.18); transition: width .2s, background .2s; }
.pg-dot.on { width: 16px; background: var(--text); }
.pg-thumbs { position: absolute; left: 0; right: 0; bottom: 8px; display: flex; gap: 5px; overflow-x: auto; padding: 3px 10px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.pg-thumbs::-webkit-scrollbar { display: none; }
.pg-thumb { width: 30px; height: 30px; border-radius: 8px; object-fit: cover; flex-shrink: 0; border: 2px solid rgba(255,255,255,.9); cursor: pointer; opacity: .85; transition: opacity .2s, border-color .2s; box-sizing: border-box; background: var(--card); display: block; }
.pg-thumb.on { border-color: var(--card-hover, #FCE4EC); opacity: 1; }
  /* ===== 商城新增：视图 / 规格 / 订单 / 拼团 ===== */
  .sku-chip { border: 2px solid var(--accent-soft); background: #fff; color: var(--text); border-radius: 999px; padding: 7px 16px; font-size: 16px; font-family: inherit; cursor: pointer; transition: all .2s; }
  .sku-chip.on { border-color:var(--accent-soft,#FCE4EC); background:var(--accent-soft,#FCE4EC); color: var(--accent-strong); }
  .sku-chip.dis { opacity: .45; cursor: not-allowed; }
  .qty-btn { border: none; background: var(--card-hover); color: var(--text); width: 30px; height: 30px; border-radius: 50%; font-size: 16px; cursor: pointer; font-family: inherit; }
  .card { background: #fff; border-radius: var(--radius); box-shadow: 0 2px 14px rgba(255,143,171,.12); }
  #view-detail, #view-cart, #view-checkout, #view-orders, #view-account, #view-groups { display: none; }
  @media (max-width: 700px) { #view-detail > div { grid-template-columns: 1fr !important; } }

  /* ── 原生 select 外观对齐设计系统（仅样式，行为不变 · 20261026k） ── */
  select { font-family: inherit; font-size: 15px; color: var(--text, #604C57); background: #fff; border: 1.5px solid var(--border, #FFD9E6); border-radius: 10px; padding: 7px 10px; outline: none; max-width: 100%; cursor: pointer; box-sizing: border-box; }
  select:focus { border-color: var(--text, #604C57); }
</style>

<div class="menu-mask" id="menu-mask"></div>
<nav class="menu" id="menu"></nav>

<header class="shop-header">
  <div class="shop-header-inner">
    <h1><span data-zh="我的账号" data-en="My Account">我的账号</span></h1>
    <p><span data-zh="登录后可以看订单、收藏和地址" data-en="Log in to see your orders, favorites and addresses">登录后可以看订单、收藏和地址</span></p>

</header>

<div class="shop-body">
<a class="back-link page-back" href="/" style="margin:8px 0 24px 2px;"><span data-zh="← 返回主页" data-en="← Back to Home">← 返回主页</span></a>
  <div class="notice">

  </div>

  <div class="grid" id="product-grid" style="display:none;">
    <p data-zh="加载中…" data-en="Loading…" style="grid-column:1/-1;text-align:center;color:var(--muted);">加载中…</p>
  </div>

  <section id="past" style="margin-top:44px;display:none;">
    <h2 style="font-size:24px;margin-bottom:14px;display:flex;align-items:center;gap:8px;"><span style="width:4px;height:18px;background:var(--accent,#ffd9e6);border-radius:2px;display:inline-block;"></span><span data-zh="往期商品" data-en="Past Items">往期商品</span></h2>
    <div class="grid" id="past-grid"></div>
  </section>

  <section id="reviews" style="margin-top:44px;display:none;">
    <h2 style="font-size:24px;margin-bottom:14px;display:flex;align-items:center;gap:8px;"><span style="width:4px;height:18px;background:var(--accent,#ffd9e6);border-radius:2px;display:inline-block;"></span><span data-zh="评价返图" data-en="Reviews">评价返图</span></h2>
    <div class="card" style="background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:20px;">
      <p style="font-size:16px;color:var(--muted);margin-bottom:10px;"><span data-zh="买过小铺东西的小可爱，欢迎晒图评价～" data-en="Bought something? Share your photos & review~">买过小铺东西的小可爱，欢迎晒图评价～</span></p>
      <input id="r-name" maxlength="30" data-ph-zh="你的名字（选填）" data-ph-en="Your name (optional)" style="width:100%;margin-bottom:10px;padding:12px 14px;font-size:18px;border:none;border-radius:12px;background:#fff;outline:none;color:var(--text);font-family:inherit;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">

  function applyLang(lang) {
    LANG = lang;

    var dict = lang === 'en' ? I18N_EN : I18N_ZH;
    var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(function (n) {
      if (!n.parentElement || n.parentElement.closest('script, style')) return;
      var txt = n.nodeValue;
      var trimmed = txt.trim();
      if (trimmed && dict[trimmed] !== undefined) {
        n.nodeValue = txt.replace(trimmed, dict[trimmed]);
      }
    });
    document.querySelectorAll('.lang-btn').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-lang') === lang);
    });
    document.querySelectorAll('[data-zh][data-en]').forEach(function (node) {

  }

  }
  function imgUrl(u) { u = String(u || ''); if (!/^data:/.test(u)) { var mR = u.match(/https?:\/\/[^/]+\.supabase\.co\/storage\/v1\/object\/public\/([^?#]+)/); if (mR) return 'https://img.yukicheng.com/' + mR[1]; var mR2 = u.match(/^\/?storage\/v1\/object\/public\/([^?#]+)/); if (mR2) return 'https://img.yukicheng.com/' + mR2[1]; } return /^https?:\/\//.test(u) ? u : '/' + u.replace(/^\/+/, ''); } // 相对图片路径转根绝对（页面在 /shop/ 下）

  // ===== 「编辑商品」：只有登录了后台账号才出现，点它跳到后台「小铺上架」并展开这件商品 =====

  var PRODUCTS = [];

  var SHOP_ADMIN = false; // 登录过后台：评价卡上出现 ⋮ 管理菜单
  try { SHOP_ADMIN = !!localStorage.getItem('yuki-admin-session'); } catch (e) {}
  function loadShopHidden() {
    return fetch(SUPABASE_URL + '/rest/v1/site_settings?select=value&key=eq.shop_hidden', {
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
    }).then(function (r) { return r.ok ? r.json() : []; }).then(function (rows) {
      var v = [];
      try { v = JSON.parse((rows && rows[0] && rows[0].value) || '[]'); } catch (e) {}
      SHOP_HIDDEN = Array.isArray(v) ? v.map(String) : [];
    }).catch(function () { SHOP_HIDDEN = []; });
  }
  function adminToken() { // 用后台登录态换 access token，让前台的删除走 authenticated
    var s = null;
    try { s = JSON.parse(localStorage.getItem('yuki-admin-session') || 'null'); } catch (e) {}
    if (!s || !s.r) return Promise.resolve(null);
    return fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST', headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: s.r })
    }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) { return d && d.access_token ? d.access_token : null; }).catch(function () { return null; });
  }
  function statusOf(p) {
    if (p.display_only) return 'display';
    if (p.sold || !(p.stock > 0)) return 'out';
    return 'on';
  }
  // ===== 多图翻页（与全站 site-common.js 同一份实现，shop 不加载 site-common 故内联） =====
  function normImgS(u) {
    u = String(u || '');
    if (!/^data:/.test(u)) { var mR = u.match(/https?:\/\/[^/]+\.supabase\.co\/storage\/v1\/object\/public\/([^?#]+)/); if (mR) return 'https://img.yukicheng.com/' + mR[1]; var mR2 = u.match(/^\/?storage\/v1\/object\/public\/([^?#]+)/); if (mR2) return 'https://img.yukicheng.com/' + mR2[1]; } 
    return /^(https?:\/\/|data:)/.test(u) ? u : '/' + u.replace(/^\/+/, '');
  }
  function escAttrDbS(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }
  function pagerImgsOf(o) {
    o = o || {};
    var arr = [];
    if (Array.isArray(o.images) && o.images.length) arr = o.images.filter(Boolean);
    else if (o.image_url) arr = [o.image_url];
    else if (o.image) arr = [o.image];
    return arr.map(function (u) { return normImgS(u); });
  }
  function pagerWrapHtml(urls, alt) {
    urls = urls || [];
    if (!urls.length) return '<div style="width:100%;aspect-ratio:1/1;background:var(--card);"></div>';
    var multi = urls.length > 1;
    return '<div class="pg-wrap" data-i="0" style="position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;background:var(--card);">' +
      '<img class="pg-img" src="' + escAttrDbS(urls[0]) + '" data-urls="' + escAttrDbS(JSON.stringify(urls)) + '" style="width:100%;height:100%;object-fit:contain;display:block;" alt="' + escAttrDbS(alt || '') + '" loading="lazy">' +
      (multi ?
        '<button type="button" class="pg-btn pg-prev" aria-label="上一张">‹</button><button type="button" class="pg-btn pg-next" aria-label="下一张">›</button>' +
        '<div class="pg-dots">' + urls.map(function (_, k) { return '<span class="pg-dot' + (k === 0 ? ' on' : '') + '"></span>'; }).join('') + '</div>' +
        '<div class="pg-thumbs">' + urls.map(function (u, k) { return '<img class="pg-thumb' + (k === 0 ? ' on' : '') + '" src="' + escAttrDbS(u) + '" data-k="' + k + '" alt="" loading="lazy">'; }).join('') + '</div>'
        : '') +
      '</div>';
  }
  function pgSet(wrap, i) { // 与 site-common 同步的副本：大图 + 极简圆点 + 底部小图预览
    var img = wrap.querySelector('.pg-img');
    var urls = [];
    try { urls = JSON.parse(img.getAttribute('data-urls') || '[]'); } catch (err) {}
    if (!urls.length) return;
    i = (i + urls.length) % urls.length;
    wrap.setAttribute('data-i', String(i));
    img.src = urls[i];
    wrap.querySelectorAll('.pg-dot').forEach(function (d, k) { d.classList.toggle('on', k === i); });
    wrap.querySelectorAll('.pg-thumb').forEach(function (t, k) {
      t.classList.toggle('on', k === i);
      if (k === i) { try { t.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' }); } catch (err) { t.scrollIntoView(); } }
    });
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('.pg-btn, .pg-thumb') : null;
    if (!t) return;
    e.preventDefault(); e.stopPropagation();
    var wrap = t.closest('.pg-wrap');
    var urls = [];
    try { urls = JSON.parse(wrap.querySelector('.pg-img').getAttribute('data-urls') || '[]'); } catch (err) {}
    if (urls.length < 2) return;
    if (t.classList.contains('pg-thumb')) { pgSet(wrap, parseInt(t.getAttribute('data-k'), 10) || 0); return; }
    var i = parseInt(wrap.getAttribute('data-i'), 10) || 0;
    pgSet(wrap, i + (t.classList.contains('pg-next') ? 1 : -1));
  }, true);
  function fmtPriceShop(v) {
    var s = String(v == null ? '' : v).trim().replace(/^[¥$]+/, '');

  }
  function productCard(p) {
    var img = pagerWrapHtml(pagerImgsOf({ images: p.images, image_url: p.image_url }), p.name);

    return '<div class="product' + off + '">' +
      '<div class="product-img">' + img + '<span class="st ' + stCls + '">' + stText + '</span></div>' +

      '<span class="product-tag">' + esc(p.tag || t('没有标签','Untagged')) + '</span>' +
      '<h3>' + esc(p.name) + '</h3>' +

      '<div class="product-row">' +
      '<span class="price">' + (p.price ? '<small>' + ((p.currency || 'USD') === 'CNY' ? '¥' : '$') + '</small>' + esc(fmtPriceShop(p.price)) : '') + '</span>' +

      productEditBtn(p) +
      '</div></div></div>';
  }

      grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--muted);">' + t('新品准备中，敬请期待～', 'New goodies coming soon~') + '</p>';

    var pastGrid = document.getElementById('past-grid');

  // 收款方式：按钮 → 弹出收款码图片（点 × / 点背景 / Esc 关闭）

  // ===== 评价返图 =====
  var RATING = 0;

  function starText(n) { return '☆☆☆☆☆'.slice(0, n) + '★★★★★'.slice(0, 5 - n); }

    var n = this.files && this.files[0] ? this.files[0].name : '';
    el.innerHTML = n ? '已选：' + esc(n) : '<span data-zh="未选择图片" data-en="No photo chosen">未选择图片</span>';
    if (!n) applyLang(LANG);
  });
  function fmtDate(iso) {
    var d = new Date(iso);
    return (d.getMonth() + 1) + '.' + d.getDate();
  }
  function loadReviews() {
    fetch(SUPABASE_URL + '/rest/v1/reviews?select=id,name,content,rating,image_url,created_at&order=created_at.desc&limit=100', {
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
    }).then(function (r) { return r.json(); }).then(function (rows) {
      var list = document.getElementById('review-list');
      if (!rows || !rows.length) {
        list.innerHTML = '<p style="text-align:center;color:var(--muted);font-size:17px;">' + t('还没有评价，来做第一个吧～', 'No reviews yet, be the first~') + '</p>';
        return;
      }
      list.innerHTML = rows.map(function (rv) {
        var img = rv.image_url ? '<img src="' + esc(imgUrl(rv.image_url)) + '" style="width:120px;height:120px;object-fit:cover;border-radius:12px;margin-top:10px;display:block;">' : '';
        var stars = '<span style="color:var(--text,#604C57);letter-spacing:2px;">' + starText(rv.rating || 5) + '</span> <span style="font-size:15px;">' + (rv.rating || 5) + '/5</span>';
        var kebab = SHOP_ADMIN ? '<button class="rv-kebab" data-id="' + esc(rv.id) + '" aria-label="管理">⋮</button>' : '';
        return '<div class="rv-card" data-rv="' + esc(rv.id) + '" style="background:#fff;border-radius:var(--radius);padding:14px 16px;' + (SHOP_ADMIN ? 'padding-right:52px;' : '') + 'margin-bottom:12px;box-shadow:0 2px 10px rgba(180,120,150,.10);position:relative;">' +
          '<div style="font-size:16px;color:var(--muted);">' + esc(rv.name || t('小可爱','A lovely buyer')) + ' · ' + fmtDate(rv.created_at) + '</div>' +
          '<div style="margin-top:4px;">' + stars + '</div>' +
          '<div style="font-size:17px;margin-top:4px;white-space:pre-wrap;word-break:break-word;">' + esc(rv.content) + '</div>' +
          img + kebab + '</div>';
      }).join('');
    }).catch(function () {
      document.getElementById('review-list').innerHTML = '<p style="text-align:center;color:var(--muted);font-size:17px;">' + t('评价加载失败，请刷新重试','Failed to load reviews, please refresh') + '</p>';
    });
  }
  document.getElementById('rv-menu-del').addEventListener('click', function () {
    var id = RV_MENU_ID;
    rvMenuClose();
    if (!id) return;
    adminToken().then(function (tk) {
      if (!tk) { toast(t('请先在后台登录再删', 'Please log in first')); return; }
      return fetch(SUPABASE_URL + '/rest/v1/reviews?id=eq.' + id, {
        method: 'DELETE',
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + tk, 'Prefer': 'return=representation' }
      }).then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('del')); }).then(function (back) {
        if (!Array.isArray(back) || !back.length) { toast(t('没删掉：删除权限还没开，先去 Supabase 跑那段 SQL', 'Not deleted: run the SQL in Supabase first')); return; }
        toast(t('已删除', 'Deleted'));
        loadReviews();
      });
    }).catch(function () { toast(t('删除失败，稍后再试', 'Delete failed, try again later')); });
  });
  var RV_MENU_ID = null;
  function rvMenuClose() { document.getElementById('rv-menu').classList.remove('open'); }
  document.getElementById('review-list').addEventListener('click', function (e) {
    var kb = e.target.closest('.rv-kebab');
    if (!kb) return;
    e.stopPropagation();
    RV_MENU_ID = kb.getAttribute('data-id');
    rvMenuClose();
    var m = document.getElementById('rv-menu');
    var r = kb.getBoundingClientRect();
    m.classList.add('open');
    var top = window.scrollY + r.bottom + 6;
    var left = window.scrollX + Math.max(8, Math.min(r.right - m.offsetWidth, window.innerWidth - m.offsetWidth - 8));
    m.style.top = Math.round(top) + 'px';
    m.style.left = Math.round(left) + 'px';
  });
  document.addEventListener('click', function (e) {
    if (e.target.closest && (!e.target.closest('#rv-menu') && !e.target.closest('.rv-kebab'))) rvMenuClose();
  });
  document.getElementById('r-submit').addEventListener('click', function () {
    var btn = this;
    var name = document.getElementById('r-name').value.trim();
    var text = document.getElementById('r-text').value.trim();
    var file = document.getElementById('r-file').files[0];
    if (!text) { toast(t('先写点评价内容哦', 'Please write something first')); return; }
    if (!RATING) { toast(t('记得点星星评分哦', 'Please pick a star rating first')); return; }
    btn.disabled = true;
    btn.style.opacity = '.5';
    var upload = file
      ? fetch(SUPABASE_URL + '/storage/v1/object/reviews/' + Date.now() + '-' + file.name.replace(/[^\w.\-]/g, '_'), {
          method: 'POST',
          headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': file.type || 'image/jpeg' },
          body: file
        }).then(function (r) { if (!r.ok) throw new Error('upload failed'); return r.json(); })
          .then(function (res) { return SUPABASE_URL + '/storage/v1/object/public/reviews/' + res.Key.split('/').slice(1).join('/'); })
      : Promise.resolve(null);
    upload.then(function (imageUrl) {
      return fetch(SUPABASE_URL + '/rest/v1/reviews', {
        method: 'POST',
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, content: text, rating: RATING, image_url: imageUrl })
      });
    }).then(function (r) {
      if (!r.ok) throw new Error();
      toast(t('评价提交成功，谢谢你～', 'Review submitted, thank you~'));
      document.getElementById('r-name').value = '';
      document.getElementById('r-text').value = '';
      document.getElementById('r-file').value = '';
      document.getElementById('r-file-name').innerHTML = '<span data-zh="未选择图片" data-en="No photo chosen">未选择图片</span>';
      applyLang(LANG);
      RATING = 0;
      paintStars();
      loadReviews();
    }).catch(function () {
      toast(t('提交失败，稍后再试试', 'Submission failed, try again later'));
    }).finally(function () {
      btn.disabled = false;
      btn.style.opacity = '';
    });
  });
  loadReviews();
  var shopSec = new URLSearchParams(location.search).get('sec');
  if (shopSec === 'reviews' || shopSec === 'pay') {
    setTimeout(function () {
      var el = document.getElementById(shopSec);
      if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.pageYOffset - 74, behavior: 'smooth' });
    }, 300);
  }
</script>
<script src="/js/shop-app.js?v=20261031C"></script>
<script src="/js/site-footer.js?v=20261031C"></script>
<script>
  // 统一 Footer（已有 <footer> 则替换其内容，不新建第二个）
  function initSiteFooter() { renderSiteFooter(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initSiteFooter);
  else initSiteFooter();
</script>
