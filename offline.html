<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网络开小差了 · Yuki / 柚子</title>
<link rel="icon" type="image/png" sizes="180x180" href="/icon-yuki2-180.png">
<!-- 断网兜底页：全部内联，不依赖任何外部资源 -->
<style>
  :root { --bg: #FFFBFC; --card: #FFFFFF; --text: #604C57; --muted: #A88E9B; --accent: #ffd9e6; --accent-soft: #FCE4EC;
    --accent-strong: #A98D96; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: "Millo Body", "Millo-RiceSoyMilk80", -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif; }
  .er-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .er-card { background: var(--card); border-radius: 16px; padding: 44px 40px; text-align: center; max-width: 420px; width: 100%; box-shadow: 0 10px 40px rgba(180,120,150,.14); }
  .er-logo { width: 84px; height: 84px; border-radius: 50%; object-fit: cover; border: 3px solid #fff; box-shadow: 0 4px 16px rgba(255,111,165,.25); }
  .er-title { font-size: 24px; font-weight: 700; margin-top: 18px; }
  .er-sub { font-size: 16px; color: var(--muted); margin-top: 8px; line-height: 1.6; }
  .er-star { color: var(--accent-soft); }
  .er-btns { margin-top: 26px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .er-btn { display: inline-flex; align-items: center; justify-content: center; height: 46px; padding: 0 26px; border-radius: 999px; font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer; text-decoration: none; border: none; }
  .er-btn-main { background:#FCE1EA; color: #A98D96; font-weight:600; }
  .er-btn-soft { background: #fff; color:var(--text,#604C57); border: 1.5px solid var(--accent-soft); }
</style>
<script>/* 主题色本地快照（无 site-common 页）；完整主题来自 site_settings.theme_colors */
try { var __t = JSON.parse(localStorage.getItem('yuki-theme-colors') || 'null'); if (__t && typeof __t === 'object') { var __m = { text: '--text', muted: '--muted', bg: '--bg', card: '--card', accent: '--accent', accentSoft: '--accent-soft', accentStrong: '--accent-strong', price: '--price', success: '--success', warning: '--warning', danger: '--danger' }, __r = document.documentElement.style; Object.keys(__m).forEach(function (k) { if (__t[k]) __r.setProperty(__m[k], __t[k]); }); } } catch (e) {}</script>
  <link rel="stylesheet" href="/css/button-theme.css?v=20261031E">
</head>
<body>
  <div class="er-wrap">
    <div class="er-card">
      <img class="er-logo" src="/logo.png" alt="柚子">
      <div class="er-title">网络开小差了 <span class="er-star">～ ♡</span></div>
      <div class="er-sub">网页加载失败，检查一下网络再试试吧<br>Network hiccup · try again in a moment</div>
      <div class="er-btns">
        <button class="er-btn er-btn-main" onclick="location.reload()">重试</button>
        <a class="er-btn er-btn-soft" href="/">回主页</a>
      </div>
    </div>
  </div>
</body>
</html>
