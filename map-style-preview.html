<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google Maps 奶油粉配色预览 · Snow Yuzu（未上线预览）</title>
<link rel="stylesheet" href="/css/site.css?v=20261117M">
<link rel="stylesheet" href="/css/button-theme.css?v=20261117H">
<style>
  body { background: var(--bg,#FFF8FA); margin: 0; font-family: inherit; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 40px 24px 60px; }
  h1 { color:#65515D; font-size: 24px; margin: 0 0 6px; }
  .tip { color:#897783; font-size: 15px; line-height: 1.9; margin: 0 0 18px; }
  .tip b { color:#B98598; }
  #pv-map { width: 100%; height: 560px; border-radius: 18px; border: 1.5px solid #F9E5ED; background: #FCEEEF; }
  @media (max-width: 640px) { #pv-map { height: 380px; } }
  .swatches { display:flex; gap: 14px; flex-wrap: wrap; margin: 16px 0 0; }
  .sw { display:flex; align-items:center; gap:8px; font-size:14px; color:#65515D; }
  .sw i { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid #F9E5ED; display:inline-block; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Google Maps 奶油粉配色预览 ♡</h1>
  <p class="tip">
    这是<b>独立预览页</b>，未接入正式美食地图，只用来确认配色效果。真实道路/国界/地名数据完整，缩放、拖动可用。<br>
    配色确认后：把 <b>docs/google-map-style-yuzu.json</b> 导入 Google Cloud Console 的 Map Styles 并关联现有 Map ID，正式地图就会自动变成这个效果（前台代码零改动）。
  </p>
  <div id="pv-map"></div>
  <div class="swatches">
    <span class="sw"><i style="background:#FCEEEF"></i>海洋 #FCEEEF</span>
    <span class="sw"><i style="background:#FFF9F5"></i>陆地 #FFF9F5</span>
    <span class="sw"><i style="background:#E8F3E6"></i>公园 #E8F3E6</span>
    <span class="sw"><i style="background:#F3DDE4"></i>道路 #F3DDE4</span>
    <span class="sw"><i style="background:#E6D3DA"></i>国界 #E6D3DA</span>
    <span class="sw"><i style="background:#7A6A70"></i>文字 #7A6A70</span>
  </div>
</div>
<script>
(function () {
  var anon = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVreHJ2Y3B0d2hsd3ZkYW5vdmdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMzgyNDcsImV4cCI6MjEwODgxNDI0N30.Grdi23yToGPFF8e_kxFjf37JOOf51j-FW_FYQTUVu8E';
  // 指定色板（与 docs/google-map-style-yuzu.json 一致）；预览页刻意不用 Map ID——
  // 带 Map ID 时 Google 只认 Cloud 样式，代码里的 styles 数组会被忽略，预览就看不到效果了
  var STYLE = [
    { featureType: 'water', elementType: 'geometry.fill', stylers: [{ color: '#FCEEEF' }] },
    { featureType: 'water', elementType: 'labels.text.fill', stylers: [{ color: '#B79AA4' }] },
    { featureType: 'water', elementType: 'labels.text.stroke', stylers: [{ color: '#FFF9F5' }] },
    { featureType: 'landscape', elementType: 'geometry.fill', stylers: [{ color: '#FFF9F5' }] },
    { featureType: 'landscape.man_made', elementType: 'geometry.fill', stylers: [{ color: '#FFFBF8' }] },
    { featureType: 'poi.park', elementType: 'geometry.fill', stylers: [{ color: '#E8F3E6' }] },
    { featureType: 'poi.attraction', elementType: 'labels.text.fill', stylers: [{ color: '#7A6A70' }] },
    { featureType: 'road', elementType: 'geometry.fill', stylers: [{ color: '#F3DDE4' }] },
    { featureType: 'road.highway', elementType: 'geometry.fill', stylers: [{ color: '#F3D9E2' }] },
    { featureType: 'road', elementType: 'geometry.stroke', stylers: [{ color: '#F0E4E8' }] },
    { featureType: 'road', elementType: 'labels.text.fill', stylers: [{ color: '#7A6A70' }] },
    { featureType: 'road', elementType: 'labels.text.stroke', stylers: [{ color: '#FFF9F5' }] },
    { featureType: 'administrative', elementType: 'geometry.stroke', stylers: [{ color: '#E6D3DA' }] },
    { featureType: 'administrative.country', elementType: 'labels.text.fill', stylers: [{ color: '#7A6A70' }] },
    { featureType: 'administrative.locality', elementType: 'labels.text.fill', stylers: [{ color: '#7A6A70' }] },
    { featureType: 'administrative.neighborhood', elementType: 'labels.text.fill', stylers: [{ color: '#93848B' }] },
    { featureType: 'poi', elementType: 'labels.text.fill', stylers: [{ color: '#93848B' }] },
    { featureType: 'transit', elementType: 'labels.text.fill', stylers: [{ color: '#93848B' }] }
  ];
  fetch('https://ukxrvcptwhlwvdanovgd.supabase.co/rest/v1/foodie_map_config?select=google_key&limit=1', { headers: { apikey: anon, Authorization: 'Bearer ' + anon } })
    .then(function (r) { return r.json(); })
    .then(function (rows) {
      var key = rows && rows[0] && rows[0].google_key;
      if (!key) { document.getElementById('pv-map').textContent = '未配置 Google Maps Key'; return; }
      window.__pvReady = function () {
        /* classic Map（无 mapId）+ classic Marker：styles 数组才会生效，专供配色预览 */
        var map = new google.maps.Map(document.getElementById('pv-map'), {
          center: { lat: 33.68, lng: -117.79 }, // Irvine 一带，方便看道路/街区配色
          zoom: 12,
          styles: STYLE,
          mapTypeControl: false, streetViewControl: false, fullscreenControl: false
        });
        new google.maps.Marker({ position: { lat: 33.66392, lng: -117.7412 }, map: map, title: 'In-N-Out Burger（示例标记）' });
      };
      var s = document.createElement('script');
      s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key) + '&v=weekly&loading=async&callback=__pvReady';
      s.async = true;
      document.head.appendChild(s);
    })
    .catch(function () { document.getElementById('pv-map').textContent = '配置读取失败'; });
})();
</script>
</body>
</html>
