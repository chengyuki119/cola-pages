<script>
  // 照片展示门禁：登录后可见（任意登录账号；未登录显示粉色提示卡并停载所有数据）
  window.YK_PHOTOS_GATE = (window.ykGatePage ? ykGatePage('photos') : Promise.resolve(true));
  window.YK_PHOTOS_GATE.then(function (ok) { if (ok) document.body.classList.add('yk-photos-on'); });
</script>
<script>
  // ===== Photo Gallery：独立子页（数据库驱动 + 静态回退） =====
  var PHOTO_STYLES = {};
  function albumHtml(list) {
    return list.map(function (p) {
      var zh = p.caption_zh || '';
      var en = p.caption_en || zh;
      var st = PHOTO_STYLES[p.id];
      return '<figure class="album-item' + (st && st !== 'normal' ? ' st-' + escAttrDb(st) : '') + '" data-img="' + escAttrDb(p.image_url) + '">' +
        '<div class="album-img"></div>' +
        '<figcaption data-zh="' + escAttrDb(zh) + '" data-en="' + escAttrDb(en) + '">' + escDb(zh) + '</figcaption>' +
        '</figure>';
    }).join('');
  }
  function fillAlbum(box, list) {
    box.innerHTML = albumHtml(list);
    box.querySelectorAll('.album-item').forEach(function (fig) {
      loadDbImg(fig.querySelector('.album-img'), fig.getAttribute('data-img'));
      bindCaption(fig.querySelector('figcaption'));
    });
  }
  function loadPhotoRows() {
    // 登录态取数（RLS 后 anon 读不到）；新字段（pinned/home）没建之前自动回退旧查询
    return ykAuthFetch('photos?select=id,category,image_url,caption_zh,caption_en,pinned,home&order=pinned.desc,sort.asc,created_at.asc&limit=300')
      .then(function (rows) {
        if (Array.isArray(rows) && rows.length) return rows;
        return ykAuthFetch('photos?select=id,category,image_url,caption_zh,caption_en&order=sort.asc,created_at.asc&limit=300');
      });
  }

  // 静态占位照片：数据库没数据时兜底显示，缺文件自动隐藏（门禁通过后才填充）
  window.YK_PHOTOS_GATE.then(function (okG) {
    if (!okG) return;
    document.querySelectorAll('section[data-sec] .album-item[data-img]').forEach(function (fig) {
    var src = normImg(fig.getAttribute('data-img'));
    var probe = new Image();
    probe.onload = function () {
      var img = document.createElement('img');
      img.src = src;
      img.alt = '照片';
      fig.querySelector('.album-img').appendChild(img);
    };
    probe.onerror = function () { fig.style.display = 'none'; };
    probe.src = src;
  });
    document.querySelectorAll('section[data-sec] .album-item figcaption').forEach(bindCaption);
  });

  // 每分区「每行显示」：存 site_settings.photo_grid（{ 分区key: 1..5 }），默认 5（她 20261027 01:00：照片也要五个一排）
  var PHOTO_GRID = {};
  function applyGrid(secEl, key) {
    var n = parseInt(PHOTO_GRID[key], 10);
    if (!(n >= 1 && n <= 5)) n = 5;
    secEl.style.setProperty('--pr', n);
    secEl.style.setProperty('--pr-md', Math.min(n, 3));
    secEl.style.setProperty('--pr-sm', Math.min(n, 2));
  }
  function applyGrids() {
    document.querySelectorAll('section[data-sec]').forEach(function (secEl) { applyGrid(secEl, secEl.getAttribute('data-sec')); });
  }
  dbFetch('site_settings?select=key,value&key=eq.photo_grid&limit=1').then(function (rr) {
    (rr || []).forEach(function (row) { try { PHOTO_GRID = JSON.parse(row.value || '{}') || {}; } catch (e) {} });
    applyGrids();
  });

  window.YK_PHOTOS_GATE.then(function (okG) {
    if (!okG) return;
    return Promise.all([
    ykAuthFetch('photo_sections?select=id,key,name_zh,name_en,sort&order=sort.asc,created_at.asc&limit=100'),
    loadPhotoRows(),
    dbFetch('site_settings?select=key,value&key=eq.photo_styles&limit=1').then(function (rr) {
      (rr || []).forEach(function (row) { try { PHOTO_STYLES = JSON.parse(row.value || '{}') || {}; } catch (e) {} });
      return null;
    })
  ]).then(function (res) {
    var sections = res[0] || [];
    var rows = res[1] || [];
    if (!sections.length && !rows.length) return; // 分区表与照片表都空：保持静态占位兜底（分区表空但有照片时，下面会归入「没有标签」显示）
    var groups = {};
    rows.forEach(function (p) {
      (groups[p.category] = groups[p.category] || []).push(p);
    });
    sections.forEach(function (sec) {
      var list = groups[sec.key] || [];
      if (sec.key === 'bjd' || sec.key === 'bjdselfie') return; // BJD 系列有独立页面，不进照片展示页
      var box = document.querySelector('#sec-' + sec.key + ' .album');
      var secEl = box ? box.closest('section') : null; // 已存在的分区：直接定位到它的 section
      if (!box) {
        // 新增分区：动态建区块
        secEl = document.createElement('section');
        secEl.id = 'sec-' + sec.key;
        secEl.setAttribute('data-sec', sec.key);
        secEl.innerHTML = '<h2 data-zh="' + escAttrDb(sec.name_zh) + '" data-en="' + escAttrDb(sec.name_en) + '">' + escDb(sec.name_zh) + '</h2><div class="album"></div>';
        var footer = document.querySelector('footer');
        if (footer) footer.parentNode.insertBefore(secEl, footer);
        else document.querySelector('.page-body').appendChild(secEl);
        box = secEl.querySelector('.album');
      }
      applyGrid(secEl, sec.key);
      if (list.length) fillAlbum(box, list);
    });
    window.PHOTO_SECTIONS = sections.filter(function (sec) {
      return sec.key !== 'bjd' && sec.key !== 'bjdselfie' && ((groups[sec.key] || []).length || document.getElementById('sec-' + sec.key));
    }).sort(function (a, b) { return (a.sort || 0) - (b.sort || 0); });
    // 兜底分组：category 为空字符串、或指向已删除分区的照片，统一归到「没有标签」，排在列表最后；只在有照片时显示
    var knownKeys = {};
    sections.forEach(function (sec) { knownKeys[sec.key] = true; });
    var orphans = rows.filter(function (p) {
      var c = p.category || '';
      return c === '' || !knownKeys[c];
    });
    if (orphans.length) {
      var U_KEY = '__untagged__';
      var uSec = document.getElementById('sec-' + U_KEY);
      if (!uSec) {
        uSec = document.createElement('section');
        uSec.id = 'sec-' + U_KEY;
        uSec.setAttribute('data-sec', U_KEY);
        uSec.innerHTML = '<h2 data-zh="没有标签" data-en="Untagged / No section"></h2><div class="album"></div>';
        var uFooter = document.querySelector('footer');
        if (uFooter) uFooter.parentNode.insertBefore(uSec, uFooter);
        else document.querySelector('.page-body').appendChild(uSec);
      }
      var uH2 = uSec.querySelector('h2');
      if (uH2) uH2.textContent = t('没有标签', 'Untagged / No section');
      applyGrid(uSec, U_KEY);
      fillAlbum(uSec.querySelector('.album'), orphans);
      window.PHOTO_SECTIONS.push({ key: U_KEY, name_zh: '没有标签', name_en: 'Untagged / No section', sort: 999999 });
    }
    applyGrids(); // 新建分区也套上列数
    // 照片展示文案（后台同步）：页面标题 + 说明小字
    dbFetch('site_settings?select=key,value&key=eq.gallery_copy&limit=1').then(function (rr) {
      var gc = {};
      try { (rr || []).forEach(function (row) { gc = JSON.parse(row.value || '{}') || {}; }); } catch (e) {}
      var tt = document.querySelector('.subpage-title');
      if (tt && gc.title_zh) {
        tt.setAttribute('data-zh', gc.title_zh);
        tt.setAttribute('data-en', gc.title_en || gc.title_zh);
        tt.textContent = (LANG === 'en' && gc.title_en) ? gc.title_en : gc.title_zh;
      }
      if (gc.sub_zh || gc.sub_en) {
        var sp = document.querySelector('.subpage-sub');
        if (sp) {
          var zh = gc.sub_zh || sp.getAttribute('data-zh') || '';
          var en = gc.sub_en || zh;
          sp.setAttribute('data-zh', zh);
          sp.setAttribute('data-en', en);
          sp.textContent = (LANG === 'en') ? en : zh;
        }
      }
    });
  }).catch(function () {});
  });

  // /photos/?sec=xxx → 滚动到对应分区（来自菜单）
  (function () {
    var sec = new URLSearchParams(location.search).get('sec');
    if (sec) {
      var el = document.getElementById('sec-' + sec);
      if (el) scrollToEl(el);
    }
  })();
  if (window.SiteMenu) SiteMenu.notify('gallery');
  applyLang(LANG);
</script>
