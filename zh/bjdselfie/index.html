<script>ykGatePage('photos').then(function (ok) { if (!ok) return; document.body.classList.add('yk-gated-ok'); }); /* 登录后才能看（普通买家+专属都可）；匿名时权限提示页接管 */</script>
<script>
  // ===== BJD萌物自拍：独立照片页（分区 key=bjdselfie，与后台照片管理同一套数据） =====
  var PHOTO_STYLES = {};
  var SEC_KEY = 'bjdselfie';
  function albumHtml(list) {
    return list.map(function (p) {
      var zh = p.caption_zh || '';
      var en = p.caption_en || zh;
      var st = PHOTO_STYLES[p.id];
      return '<figure class="album-item' + (st && st !== 'normal' ? ' st-' + escAttrDb(st) : '') + '" data-img="' + escAttrDb(p.image_url) + '">' +
        '<div class="album-img"></div>' +
        '<figcaption data-zh="' + escAttrDb(zh) + '" data-en="' + escAttrDb(en) + '">' + escDb(zh) + '</figcaption>' +
        '</figure>';
    }).join('');
  }
  function fillAlbum(box, list) {
    box.innerHTML = albumHtml(list);
    box.querySelectorAll('.album-item').forEach(function (fig) {
      loadDbImg(fig.querySelector('.album-img'), fig.getAttribute('data-img'));
      bindCaption(fig.querySelector('figcaption'));
    });
  }
  function loadPhotoRows() {
    // 新字段（pinned/home）没建之前自动回退旧查询，照片功能不受影响
    return fetch(DB_BASE + 'photos?select=id,category,image_url,caption_zh,caption_en,pinned,home&order=pinned.desc,sort.asc,created_at.asc&limit=300', { headers: DB_HEADERS })
      .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
      .catch(function () {
        return dbFetch('photos?select=id,category,image_url,caption_zh,caption_en&order=sort.asc,created_at.asc&limit=300');
      });
  }

  // 每行显示：photo_grid[bjdselfie]，后台分区设置同一份
  var PHOTO_GRID = {};
  function applyGrid() {
    var secEl = document.getElementById('sec-bjdselfie');
    var n = parseInt(PHOTO_GRID[SEC_KEY], 10);
    if (!(n >= 1 && n <= 4)) n = 4;
    secEl.style.setProperty('--pr', n);
    secEl.style.setProperty('--pr-md', Math.min(n, 3));
    secEl.style.setProperty('--pr-sm', Math.min(n, 2));
  }
  dbFetch('site_settings?select=key,value&key=eq.photo_grid&limit=1').then(function (rr) {
    (rr || []).forEach(function (row) { try { PHOTO_GRID = JSON.parse(row.value || '{}') || {}; } catch (e) {} });
    applyGrid();
  });

  Promise.all([
    loadPhotoRows(),
    dbFetch('site_settings?select=key,value&key=eq.photo_styles&limit=1').then(function (rr) {
      (rr || []).forEach(function (row) { try { PHOTO_STYLES = JSON.parse(row.value || '{}') || {}; } catch (e) {} });
      return null;
    })
  ]).then(function (res) {
    var rows = res[0] || [];
    var list = rows.filter(function (p) { return p.category === SEC_KEY; });
    var box = document.querySelector('#sec-bjdselfie .album');
    if (list.length) fillAlbum(box, list);
    else document.getElementById('bjd-empty').style.display = 'block';
  }).catch(function () {
    document.getElementById('bjd-empty').style.display = 'block';
  });

  applyLang(LANG);
</script>
