<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <script src="/js/lang-path.js?v=20261114B"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foodie Map · Snow Yuzu</title>
  <meta name="description" content="Explore restaurants around the world on the Snow Yuzu Foodie Map.">
  <link rel="canonical" href="https://yukicheng.com/foodie/map/">
  <meta property="og:title" content="Foodie Map · Snow Yuzu">
  <meta property="og:image" content="https://yukicheng.com/og-image.jpg">
  <link rel="icon" type="image/png" sizes="32x32" href="/icon-yuki2-32.png">
<link rel="icon" type="image/png" sizes="180x180" href="/icon-yuki2-180.png">
  <link rel="stylesheet" href="/css/site.css?v=20261117M">
  <link rel="stylesheet" href="/site-menu.css?v=20261117M">
  <link rel="stylesheet" href="/css/foodie.css?v=20261117F">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css?v=20261114B">
  <link rel="stylesheet" href="/vendor/leaflet/MarkerCluster.css?v=20261114B">
  <link rel="stylesheet" href="/vendor/leaflet/MarkerCluster.Default.css?v=20261114B">
  <script src="/js/site-common.js?v=20261117C"></script>
  <script src="/site-menu.js?v=20261117R" defer></script>
  <script src="/js/foodie-app.js?v=20261117B" defer></script>
  <script src="/js/foodie-coord.js?v=20261116B"></script>
  <script src="/vendor/leaflet/leaflet.js?v=20261114B"></script>
  <script src="/vendor/leaflet/leaflet.markercluster.js?v=20261114B"></script>
  <script src="/vendor/google/markerclusterer.umd.js?v=20261116B"></script>
  <script src="/js/foodie-map-engine.js?v=20261117C"></script>
  <script src="/js/foodie-map.js?v=20261117B" defer></script>
  <link rel="stylesheet" href="/css/button-theme.css?v=20261117H">
  <style>
    .fd-hero { margin: 4px 0 14px; }
    .fd-hero h1 { font-size: 25px; font-weight: 700; color: var(--text,#65515D); margin: 0; }
    .fd-map-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .fd-map-cta { display: inline-flex; align-items: center; gap: 7px; flex-shrink: 0; } /* 几何/配色统一走公共层 */
    .fd-map-cta:hover { background: var(--opt-bg-h,#F6C5D7); }
    .fd-q-clear { border: none; background: none; color: var(--muted,#897783); cursor: pointer; font-size: 15px; line-height: 1; padding: 2px 4px; flex-shrink: 0; font-family: inherit; }
    .fd-q-clear:hover { color: var(--accent-strong,#B98598); }
    .fd-map-cta[disabled] { opacity: .6; cursor: wait; }
    @media (max-width: 560px) { .fd-map-toolbar { gap: 8px; } .fd-map-cta { padding: 9px 14px; font-size: 15px; } }
    .fd-icon-btn { width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid var(--card-border,#F9E5ED); background: var(--card,#FFFFFF); color: var(--muted,#897783); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .fd-icon-btn:hover { background: var(--opt-bg-h,#F6C5D7); }
    .leaflet-container { font-family: inherit; }
    .fd-pin { background: none; border: none; }
    .fd-pop .leaflet-popup-content-wrapper { border-radius: 14px; box-shadow: 0 8px 24px rgba(180,120,150,.2); }
  </style>
</head>
<body>

<header class="topbar">
    <div class="lang-switch">
    <button class="lang-btn" data-lang="zh">简体中文</button>
    <button class="lang-btn" data-lang="en">English</button>
  </div>
  <a class="site-logo" href="/" aria-label="Back to home"><img src="/logo.png" alt="logo"></a>
  <div class="topbar-right">
    <a class="topbar-cart" id="topbar-cart" href="/shop/?sec=cart" aria-label="Cart">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2.5 3.5h2.2l2.3 11.2a1.8 1.8 0 0 0 1.8 1.4h8.5a1.8 1.8 0 0 0 1.8-1.4l1.5-8.2H6"/></svg>
      <span class="topbar-cart-badge" id="topbar-cart-badge" style="display:none;">0</span>
    </a>
    <button class="topbar-acct" id="topbar-acct" aria-label="账号">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.2" r="3.4"/><path d="M5 20c.8-3.6 3.6-5.6 7-5.6s6.2 2 7 5.6"/></svg>
      <span class="topbar-acct-dot"></span>
    </button>

    <button class="burger" id="burger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
<div class="menu-mask" id="menu-mask"></div>
<nav class="menu" id="menu"></nav>

<div class="subpage-header">
  <h1 class="subpage-title" data-zh="美食地图" data-en="Foodie Map">Foodie Map</h1>
  <p class="subpage-sub" data-zh="拖动地图找好吃的" data-en="Drag the map, find something delicious">Drag the map, find something delicious</p>
</div>
<a class="back-link page-back" href="/foodie/" style="margin:8px 0 20px 2px;"><span data-zh="← 美食地图" data-en="← Foodie Map">← Foodie Map</span></a>

<div class="page-body fd-page-wide" style="padding-top:4px;">
  <div class="fd-wrap fd-wrap-wide">
    <div class="fd-map-toolbar">
      <form class="fd-search" id="fd-search-form" style="flex:1;min-width:170px;margin:0;" action="#">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="fd-q" autocomplete="off">
        <button type="button" class="fd-q-clear" id="fd-q-clear" aria-label="Clear" style="display:none;">✕</button>
      </form>
      <button type="button" class="fd-map-cta fd-search-go" id="fd-search-go" style="flex-shrink:0;"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span id="fd-search-go-t" data-zh="搜索" data-en="Search">Search</span></button>
      <button type="button" class="fd-icon-btn" id="fd-locate" title="My location" aria-label="My location">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/><circle cx="12" cy="12" r="8"/></svg>
      </button>
    </div>
    <div class="fd-regions" id="fd-regions"></div>

    <div class="fd-map-page">
      <div class="fd-map-side">
        <div class="fd-map-filters" id="fd-filters">
          <div class="fd-filter-row" id="fd-f-price"></div>
          <div class="fd-filter-row" id="fd-f-yuzu"></div>
          <div class="fd-filter-row">
            <button type="button" class="fd-region-chip" id="fd-f-clear" data-fk="clear" style="display:none;"></button>
            <span class="fd-map-status" id="fd-count"></span>
            <span class="fd-map-status" id="fd-status"></span>
          </div>
        </div>
        <div class="fd-map-list" id="fd-list"></div>
      </div>
      <div id="fd-map"></div>
    </div>
  </div>
</div>

<script src="/js/site-footer.js?v=20261114B" defer></script>
</body>
</html>
