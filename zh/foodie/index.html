<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <script src="/js/lang-path.js?v=20261114A"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foodie Map · Snow Yuzu</title>
  <meta name="description" content="Snow Yuzu Foodie Map — a global food map: find restaurants across the US, Japan, Taiwan, Mainland China and Canada, with Yuki's own yuzu-rated picks.">
  <link rel="canonical" href="https://yukicheng.com/foodie/">
  <meta property="og:title" content="Foodie Map · Snow Yuzu">
  <meta property="og:description" content="A global food map with yuzu-rated restaurant picks.">
  <meta property="og:url" content="https://yukicheng.com/foodie/">
  <meta property="og:image" content="https://yukicheng.com/og-image.jpg">
  <link rel="icon" type="image/png" sizes="180x180" href="/icon-yuki2-180.png">
  <link rel="stylesheet" href="/css/site.css?v=20261107H">
  <link rel="stylesheet" href="/site-menu.css?v=20261105C">
  <link rel="stylesheet" href="/css/foodie.css?v=20261114A">
  <script src="/js/site-common.js?v=20261107H"></script>
  <script src="/site-menu.js?v=20261114A" defer></script>
  <script src="/js/foodie-app.js?v=20261114A" defer></script>
  <link rel="stylesheet" href="/css/button-theme.css?v=20261112A">
  <style>
    .fd-hero { margin: 4px 0 18px; }
    .fd-hero h1 { font-size: 25px; font-weight: 700; color: var(--text,#65515D); margin: 0; }
    .fd-hero p { font-size: 16px; color: var(--muted,#897783); margin: 6px 0 0; line-height: 1.7; }
    .fd-lang { display: inline-flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .fd-lang-btn { border: 1.5px solid var(--card-border,#F9E5ED); background: var(--card,#FFFFFF); color: var(--muted,#897783); border-radius: 999px; padding: 5px 14px; font-size: 14px; font-family: inherit; cursor: pointer; line-height: 1.4; }
    .fd-lang-btn.on { background: var(--accent-soft,#F6C5D7); border-color: var(--accent-soft,#F6C5D7); color: var(--accent-strong,#B98598); font-weight: 600; }
    .fd-map-cta { display: inline-flex; align-items: center; gap: 8px; background: var(--accent-soft,#FCECF2); border: 1.5px solid var(--card-border,#F9E5ED); color: var(--accent-strong,#B98598); border-radius: 999px; padding: 11px 22px; font-size: 16px; font-weight: 600; text-decoration: none; font-family: inherit; }
    .fd-map-cta:hover { background: var(--opt-bg-h,#F6C5D7); }
  </style>
</head>
<body>

<header class="topbar">
  <div class="lang-switch">
    <button class="lang-btn" data-lang="zh">简体中文</button>
    <button class="lang-btn" data-lang="en">English</button>
  </div>
  <a class="site-logo" href="/" aria-label="Back to home"><img src="/logo.png" alt="logo"></a>
  <div class="topbar-right">
    <a class="topbar-cart" id="topbar-cart" href="/shop/?sec=cart" aria-label="Cart">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2.5 3.5h2.2l2.3 11.2a1.8 1.8 0 0 0 1.8 1.4h8.5a1.8 1.8 0 0 0 1.8-1.4l1.5-8.2H6"/></svg>
      <span class="topbar-cart-badge" id="topbar-cart-badge" style="display:none;">0</span>
    </a>
    <button class="burger" id="burger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
<div class="menu-mask" id="menu-mask"></div>
<nav class="menu" id="menu"></nav>

<div class="subpage-header">
  <h1 class="subpage-title" data-zh="全球美食地图 ♡" data-en="Foodie Map ♡">Foodie Map ♡</h1>
  <p class="subpage-sub" data-zh="Snow Yuzu · 全球觅食指南" data-en="Snow Yuzu · a global food guide">Snow Yuzu · a global food guide</p>
</div>
<a class="back-link page-back" href="/" style="margin:8px 0 24px 2px;"><span data-zh="← 返回主页" data-en="← Back to Home">← Back to Home</span></a>

<div class="page-body" style="padding-top:6px;">
  <div class="fd-wrap">
    <div class="fd-hero">
      <p id="fd-sub"></p>
    </div>
    <div id="fd-langbox"></div>

    <div class="fd-sec">
      <form class="fd-search" id="fd-search-form" action="#">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="fd-q" autocomplete="off">
        <button class="fd-map-cta" type="submit" style="padding:8px 18px;" id="fd-search-go">Go</button>
      </form>
      <div class="fd-regions" id="fd-regions"></div>
    </div>

    <div class="fd-sec" id="sec-yuzu">
      <h2 class="fd-sec-title"><span id="t-yuzu"></span><a class="fd-more" id="more-yuzu" href="#"></a></h2>
      <div class="fd-scroll" id="list-yuzu"></div>
    </div>

    <div class="fd-sec" id="sec-featured">
      <h2 class="fd-sec-title"><span id="t-featured"></span><a class="fd-more" id="more-featured" href="#"></a></h2>
      <div class="fd-grid" id="list-featured"></div>
    </div>

    <div class="fd-sec" id="sec-recent">
      <h2 class="fd-sec-title"><span id="t-recent"></span><a class="fd-more" id="more-recent" href="#"></a></h2>
      <div class="fd-scroll" id="list-recent"></div>
    </div>

    <div class="fd-sec" style="text-align:center;">
      <a class="fd-map-cta" id="fd-map-link" href="/foodie/map/">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3.5 6v14L9 18l6 2 5.5-2V4L15 6z"/><path d="M9 4v14"/><path d="M15 6v14"/></svg>
        <span id="t-mapcta"></span>
      </a>
    </div>
  </div>
</div>

<script src="/js/site-footer.js?v=20261114A" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var F = window.FOODIE;
  if (!F) return;
  var REGION = ''; // '' = Global

  function applyStaticText() {
    document.getElementById('fd-sub').textContent = F.t('foodieMap') + ' · US / Japan / Taiwan / Mainland China / Canada';
    document.getElementById('fd-q').placeholder = F.t('searchPh');
    document.getElementById('fd-search-go').textContent = F.t('map');
    document.getElementById('t-yuzu').textContent = F.t('yuzuPicks');
    document.getElementById('t-featured').textContent = F.t('editorsPicks');
    document.getElementById('t-recent').textContent = F.t('recently');
    document.getElementById('t-mapcta').textContent = F.t('openMap');
    var qs = REGION ? '?country=' + REGION : '';
    document.getElementById('more-yuzu').textContent = F.t('seeAll');
    document.getElementById('more-featured').textContent = F.t('seeAll');
    document.getElementById('more-recent').textContent = F.t('seeAll');
    document.getElementById('more-yuzu').href = '/foodie/map/' + qs;
    document.getElementById('more-featured').href = '/foodie/map/' + qs;
    document.getElementById('more-recent').href = '/foodie/map/' + qs;
    document.getElementById('fd-map-link').href = '/foodie/map/' + qs;
    document.title = 'Foodie Map · Snow Yuzu';
  }

  function renderRegions(regions) {
    var box = document.getElementById('fd-regions');
    var chips = ['<button type="button" class="fd-region-chip' + (REGION === '' ? ' on' : '') + '" data-rc="">' + F.esc(F.t('global')) + '</button>'];
    regions.forEach(function (r) {
      var label = F.lang() === 'en' ? r.name : (r.name_zh || r.name);
      chips.push('<button type="button" class="fd-region-chip' + (REGION === r.code ? ' on' : '') + '" data-rc="' + F.esc(r.code) + '">' + F.esc(label) + '</button>');
    });
    box.innerHTML = chips.join('');
    box.onclick = function (e) {
      var b = e.target.closest('[data-rc]');
      if (!b) return;
      REGION = b.getAttribute('data-rc') || '';
      renderRegions(regions);
      applyStaticText();
      load();
    };
  }

  function fillList(id, rows, horiz) {
    var el = document.getElementById(id);
    if (!rows.length) { el.innerHTML = '<div class="fd-empty" style="width:100%;">' + F.esc(F.t('empty')) + '</div>'; return; }
    el.innerHTML = rows.map(F.cardHtml).join('');
  }

  function restFilter(extra) {
    var base = 'status=eq.published&select=*&';
    if (REGION) base += 'country_code=eq.' + encodeURIComponent(REGION) + '&';
    return base + (extra || '');
  }

  function load() {
    var countrySel = REGION ? '&country_code=eq.' + encodeURIComponent(REGION) : '';
    F.restQuery('status=eq.published&select=*&yuzu_rating=not.is.null' + countrySel + '&order=yuzu_rating.desc.nullslast,created_at.desc&limit=10')
      .then(function (rows) { fillList('list-yuzu', rows); });
    F.restQuery('status=eq.published&select=*&is_featured=eq.true' + countrySel + '&order=updated_at.desc&limit=8')
      .then(function (rows) { fillList('list-featured', rows); });
    F.restQuery('status=eq.published&select=*' + countrySel + '&order=created_at.desc&limit=10')
      .then(function (rows) { fillList('list-recent', rows); });
  }

  F.loadRegions().then(function (regions) { renderRegions(regions || []); });
  F.loadCats();
  document.getElementById('fd-langbox').innerHTML = F.langSwitcherHtml();
  F.bindLangSwitcher(function () {
    applyStaticText();
    F.loadRegions().then(renderRegions);
    load();
  });
  applyStaticText();
  load();

  document.getElementById('fd-search-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var q = (document.getElementById('fd-q').value || '').trim();
    location.href = (window.ykLink || function (x) { return x; })('/foodie/map/') + (q ? '?q=' + encodeURIComponent(q) : '') + (REGION ? (q ? '&' : '?') + 'country=' + REGION : '');
  });
});
</script>
</body>
</html>
