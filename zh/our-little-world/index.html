  <style>
    body { background: var(--bg,#FFF8FA); }
    .olw-page { max-width: 1200px; margin: 0 auto; padding: 0 24px 64px; } /* 她 20261117 02:01：所有页面 1200px */
    .olw-card { background: var(--card,#FFFFFF); border: 1.5px solid var(--card-border,#F9E5ED); border-radius: 18px; padding: 20px 22px; }
    .olw-h1 { font-size: 25px; font-weight: 700; color: var(--text,#65515D); margin: 4px 0 4px; }
    .olw-sub { font-size: 15px; color: var(--muted,#897783); margin: 0 0 20px; }
    .olw-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .olw-btn { display: inline-flex; align-items: center; gap: 8px; background: var(--accent-soft,#FCECF2); border: 1.5px solid var(--card-border,#F9E5ED); color: var(--accent-strong,#B98598); border-radius: 999px; padding: 9px 20px; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; }
    .olw-btn:hover { background: var(--opt-bg-h,#F6C5D7); }
    .olw-btn[disabled] { opacity: .55; cursor: wait; }
    .olw-btn.danger { color: #C4636E; border-color: #F2DADB; background: #FBE3E6; }
    .olw-btn.ghost { background: #fff; color: var(--muted,#897783); }
    .olw-chip { display: inline-flex; align-items: center; border: 1.5px solid var(--card-border,#F9E5ED); background: #fff; color: var(--muted,#897783); font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 999px; cursor: pointer; }
    .olw-chip.on { background: #FCECF2; border-color: #F6C5D7; color: #B98598; font-weight: 600; }
    .olw-muted { font-size: 13px; color: var(--muted,#897783); }
    .olw-kv { font-size: 15px; color: var(--text,#65515D); line-height: 1.7; }
    .olw-switch { position: relative; width: 42px; height: 24px; border-radius: 999px; background: #EFE3E8; border: 1.5px solid var(--card-border,#F9E5ED); cursor: pointer; flex-shrink: 0; transition: background .2s; }
    .olw-switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 17px; height: 17px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(180,120,150,.3); transition: left .2s; }
    .olw-switch.on { background: #F6C5D7; }
    .olw-switch.on::after { left: 20px; }
    .olw-avatar { width: 52px; height: 52px; border-radius: 50%; background: #FCECF2; border: 1.5px solid #F9E5ED; display: flex; align-items: center; justify-content: center; color: #B98598; font-weight: 700; font-size: 20px; }
    .olw-title { font-size: 17px; font-weight: 700; color: var(--text,#65515D); margin: 0 0 10px; }
    #olw-map { height: 300px; border-radius: 14px; overflow: hidden; border: 1.5px solid var(--card-border,#F9E5ED); }
    .olw-deny { text-align: center; padding: 56px 20px; }
    input.olw-in, textarea.olw-in { border: 1.5px solid var(--card-border,#F9E5ED); border-radius: 12px; padding: 9px 14px; font: inherit; font-size: 15px; color: var(--text,#65515D); outline: none; background: #fff; box-sizing: border-box; width: 100%; }
    input.olw-in:focus, textarea.olw-in:focus { border-color: #F6C5D7; }
    @media (max-width: 639px) { .olw-grid { grid-template-columns: 1fr; } }
  </style>
</head>
