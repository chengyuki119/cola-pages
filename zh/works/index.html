<script src="/js/site-common.js?v=20261117A"></script>
<script>
  // ===== 稿件展示：独立子页（稿件墙 + 稿件详情 /works/?id=N）=====
  // 数据：site_settings.works（与后台「稿件管理」同一份，单一数据源）
  var WORKS_CACHE = [];
  var CURRENT_WORK = -1;
  var WF = { artist: 'all', cat: 'all', sort: 'new' }; // 筛选排序状态（画师/种类/最新最早）

  function normWorkView(w) {
    w = w || {};
    return {
      id: w.id || '', name: w.name || '', name_en: w.name_en || '', desc_zh: w.desc_zh || '', desc_en: w.desc_en || '',
      date: w.date || '', image: w.image || '',
      artist: w.artist || '', cat: w.cat || '',
      price: w.price == null ? '' : String(w.price),
      photos: Array.isArray(w.photos) ? w.photos : [],
      visible: w.visible !== false
    };
  }
  function workDesc(w) { // 她 20261112 01:51：稿件也只填一种语言，另一种由全站机制自动生成（原文不改）
    var d = window.YK18N ? window.YK18N.pick(w.desc_zh, w.desc_en) : (LANG === 'en' ? (w.desc_en || w.desc_zh) : (w.desc_zh || w.desc_en));
    return d || '';
  }
  function workName(w) {
    var n = window.YK18N ? window.YK18N.pick(w.name, w.name_en) : w.name;
    return (window.YK18N && window.YK18N.tc) ? window.YK18N.tc(n || '') : (n || ''); // 20261112：首字母大写
  }
  function workMeta(s) { // 分类 / 画师：显示层翻译
    var x = String(s == null ? '' : s);
    if (!x) return '';
    return window.YK18N ? window.YK18N.tc(window.YK18N.t(x)) : x;
  }
  function pad2(n) { n = parseInt(n, 10); return (n < 10 ? '0' : '') + n; }
  function fmtWorkDate(ds) { // 2025-01-20 → 2025/01/20
    var p = String(ds || '').split('-');
    return p.length === 3 ? p[0] + '/' + pad2(p[1]) + '/' + pad2(p[2]) : (ds || '');
  }
  function worksFiltered() {
    var list = WORKS_CACHE.map(function (w, i) { return { w: w, i: i }; });
    list = list.filter(function (x) {
      if (WF.artist !== 'all' && x.w.artist !== WF.artist) return false;
      if (WF.cat !== 'all' && x.w.cat !== WF.cat) return false;
      return true;
    });
    var ts = function (w) { var p = String(w.date || '').split('-'); return p.length === 3 ? new Date(p[0], p[1] - 1, p[2]).getTime() : NaN; };
    list.sort(function (a, b) { // 按实际日期排序；没填日期的永远排最后
      var ta = ts(a.w), tb = ts(b.w);
      if (isNaN(ta) && isNaN(tb)) return 0;
      if (isNaN(ta)) return 1;
      if (isNaN(tb)) return -1;
      return WF.sort === 'new' ? tb - ta : ta - tb;
    });
    return list;
  }
  function renderWorksFilter() {
    var box = document.getElementById('works-filter');
    if (!box) return;
    var artists = [], cats = [];
    WORKS_CACHE.forEach(function (w) {
      if (w.artist && artists.indexOf(w.artist) === -1) artists.push(w.artist);
      if (w.cat && cats.indexOf(w.cat) === -1) cats.push(w.cat);
    });
    if (!WORKS_CACHE.length || (!artists.length && !cats.length)) { box.style.display = 'none'; return; }
    box.style.display = '';
    var ar = document.getElementById('wf-artist-row'), cr = document.getElementById('wf-cat-row');
    if (ar) ar.style.display = artists.length ? '' : 'none';
    if (cr) cr.style.display = cats.length ? '' : 'none';
    var chip = function (v, label, active) {
      return '<button type="button" class="bjd-chip' + (active ? ' active' : '') + '" data-v="' + escAttrDb(v) + '">' + label + '</button>';
    };
    document.getElementById('wf-artist').innerHTML = artists.length ? chip('all', t('全部', 'All'), WF.artist === 'all') + artists.map(function (a) { return chip(a, escDb(a), WF.artist === a); }).join('') : '';
    document.getElementById('wf-cat').innerHTML = cats.length ? chip('all', t('全部', 'All'), WF.cat === 'all') + cats.map(function (c) { return chip(c, escDb(c), WF.cat === c); }).join('') : '';
    document.getElementById('wf-sort').innerHTML =
      chip('new', t('最新优先', 'Newest first'), WF.sort === 'new') + chip('old', t('最早优先', 'Oldest first'), WF.sort === 'old');
  }
  function renderWorksWall() {
    renderWorksFilter();
    var grid = document.getElementById('works-grid');
    if (!grid) return;
    var list = worksFiltered();
    grid.innerHTML = list.map(function (x) {
      var w = x.w;
      // 她 20261102：三处（后台稿件管理/主页 Works/稿件页）统一用封面图 w.image，同图同裁切（aspect-ratio:1/1 + object-fit:cover）
      var cover = w.image ? normImg(w.image) : ((Array.isArray(w.photos) && w.photos.length) ? normImg(w.photos.filter(Boolean)[0]) : '');
      return '<div class="card work-card" data-i="' + x.i + '" style="margin-bottom:0;padding:0;overflow:hidden;cursor:pointer;">' +
        (cover ? '<div style="width:100%;aspect-ratio:1/1;overflow:hidden;background:var(--card);"><img src="' + escAttrDb(cover) + '" style="width:100%;height:100%;object-fit:cover;display:block;" alt="' + escAttrDb(workName(w)) + '" loading="lazy"></div>' : '<div style="width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--muted);font-size:15px;">' + t('暂无图片', 'No photo') + '</div>') +
        '<div style="padding:12px 14px;">' +
        '<div style="display:flex;align-items:center;gap:8px;">' +
        '<b style="flex:1;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escDb(workName(w) || t('未命名稿件', 'Untitled work')) + '</b>' +
        shareBtnHtml(x.i, 'work', true) +
        workEditBtn(x.i, WORKS_CACHE) +
        '</div>' +
        (w.date ? '<div style="font-size:15px;color:var(--muted);margin-top:3px;">' + escDb(fmtWorkDate(w.date)) + '</div>' : '') +
        (w.cat || w.artist ? '<div style="font-size:15px;color:var(--muted);margin-top:3px;">' + escDb([workMeta(w.cat), workMeta(w.artist)].filter(Boolean).join(' · ')) + '</div>' : '') +
        (parseFloat(w.price) ? '<div style="font-size:17px;color:var(--price,#F48FB1);font-weight:600;margin-top:4px;">¥' + fmtMoney(w.price) + '</div>' : '') +
        (workDesc(w) ? '<div style="font-size:16px;color:var(--text);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">' + escDb(workDesc(w)) + '</div>' : '') +
        '</div></div>';
    }).join('');
    document.getElementById('works-empty').style.display = list.length ? 'none' : '';
  }
  function renderWorkView() {
    var body = document.getElementById('works-view-body');
    if (!body) return;
    var w = WORKS_CACHE[CURRENT_WORK] ? normWorkView(WORKS_CACHE[CURRENT_WORK]) : null;
    if (!w) { body.innerHTML = '<p style="color:var(--muted);text-align:center;padding:40px 0;">' + t('没有找到这篇稿件', 'Work not found') + '</p>'; return; }
    var title = document.getElementById('works-view-title');
    if (title) title.textContent = workName(w) || t('未命名稿件', 'Untitled work');
    body.innerHTML =
      // 详情：大图 + ‹› + 圆点 + 缩略图条（检视所有图片从第一张开始，进入详情才有）
      '<div style="max-width:420px;margin:0 auto 18px;">' +
      (function () {
        var urls = (Array.isArray(w.photos) ? w.photos : []).map(function (u) { return normImg(u); }).filter(Boolean);
        if (w.image && urls.indexOf(normImg(w.image)) === -1) urls.unshift(normImg(w.image)); // 封面不在照片里才放最前
        return pagerWrapHtml(urls, workName(w));
      })() + '</div>' +
      '<div style="text-align:center;margin-bottom:18px;">' +
      '<span style="font-size:21px;font-weight:700;">' + escDb(workName(w) || t('未命名稿件', 'Untitled work')) + '</span>' +
      (w.date ? '<span style="color:var(--muted);font-size:17px;">　|　' + t('约稿日期', 'Commission Date') + t('：', ': ') + escDb(fmtWorkDate(w.date)) + '</span>' : '') +
      (w.cat || w.artist ? '<span style="color:var(--muted);font-size:17px;">　|　' + t('画师', 'Artist') + t('：', ': ') + escDb([workMeta(w.cat), workMeta(w.artist)].filter(Boolean).join(' · ')) + '</span>' : '') +
      (parseFloat(w.price) ? '<span style="color:var(--price,#F48FB1);font-size:18px;font-weight:700;">　|　¥' + fmtMoney(w.price) + '</span>' : '') +
      '</div>' +
      (workDesc(w) ? '<div style="font-size:14px;letter-spacing:.06em;color:var(--muted,#897783);margin:0 0 6px 2px;">' + t('约稿详情', 'Commission Details') + '</div>' +
        '<div class="card" style="padding:18px 20px;margin-bottom:14px;font-size:17px;line-height:1.9;white-space:pre-wrap;word-break:break-word;">' + escDb(workDesc(w)) + '</div>' : '');
  }
  function routeWorks() {
    var id = new URLSearchParams(location.search).get('id');
    if (id != null && !isNaN(parseInt(id, 10))) {
      CURRENT_WORK = parseInt(id, 10);
      document.getElementById('works-list-page').style.display = 'none';
      document.getElementById('works-view-page').style.display = '';
      renderWorkView();
    }
  }
  // 数据：柚子专属门禁（契约见 js/site-common.js ykGatePage / ykExclusiveData）
  function ykStartLoad(kind, fn) {
    // 她 20261108：三类内容（色卡/BJD/稿件）改为公开浏览——不再走登录门禁与专属 RPC，
    // 直接加载数据（匿名读公开键，管理员登录态读同一份数据）；本函数保留壳避免调用点失效
    fn();
  }
  function ykLoadData() {
  ykAuthFetch('site_settings?select=key,value&key=eq.works') /* 私有键走登录态 */.then(function (rows) {
    var raw = (window.YK_RPC_DATA !== undefined) ? window.YK_RPC_DATA : null;
    if (window.YK_RPC_DATA === undefined) { try { raw = rows && rows[0] ? JSON.parse(rows[0].value) : null; } catch (e) {} }
    WORKS_CACHE = (Array.isArray(raw) ? raw : []).map(normWorkView).filter(function (w) { return w.visible !== false; });
    var _tx = [];
    WORKS_CACHE.forEach(function (w) { _tx.push(w.name, w.name_en, w.desc_zh, w.desc_en, w.cat, w.artist); });
    return (window.YK18N ? window.YK18N.need(_tx) : Promise.resolve()).then(function () { renderWorksWall(); routeWorks(); });
  }).catch(function () {
    renderWorksWall();
    routeWorks();
  });
  }
  ykStartLoad('works', ykLoadData);
  ['wf-artist', 'wf-cat', 'wf-sort'].forEach(function (id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('click', function (e) {
      var chipEl = e.target.closest('.bjd-chip');
      if (!chipEl || !chipEl.getAttribute('data-v')) return;
      if (id === 'wf-artist') WF.artist = chipEl.getAttribute('data-v');
      else if (id === 'wf-cat') WF.cat = chipEl.getAttribute('data-v');
      else WF.sort = chipEl.getAttribute('data-v');
      renderWorksWall();
    });
  });
  var resetBtn = document.getElementById('wf-reset');
  if (resetBtn) resetBtn.addEventListener('click', function () {
    WF = { artist: 'all', cat: 'all', sort: 'new' };
    renderWorksWall();
  });
  document.getElementById('works-grid').addEventListener('click', function (e) {
    if (e.target.closest('.share-btn')) return; // 分享按钮自己处理
    var dc = e.target.closest('.work-card');
    if (dc) location.href = ykLink('/works/?id=') + dc.getAttribute('data-i');
  });
  if (window.SiteMenu) SiteMenu.notify('works');
  applyLang(LANG);
</script>

  <style>
    /* 定制申请（本页专用小样式；shop-mat-chip 与小铺同款视觉） */
    .shop-mat-chip { border: 1.5px solid var(--card-border,#F9E5ED); background: #fff; color: #897783; font: inherit; font-size: 15px; padding: 6px 16px; border-radius: 999px; cursor: pointer; }
    .shop-mat-chip.on { background: #FCECF2; border-color: #F6C5D7; color: #B98598; font-weight: 600; }
    #cf-email:focus, #cf-note:focus { border-color: #F6C5D7 !important; }
  </style>

  <!-- 定制申请（她 20261117 第二任务书 第二部分 §六：可选步骤；选素材≠购买，不扣库存） -->
  <section id="commission-form-sec" style="max-width:1200px;margin:0 auto;padding:0 20px 56px;">
    <div style="background:var(--card,#FFFFFF);border:1.5px solid var(--card-border,#F9E5ED);border-radius:18px;padding:24px 26px 22px;max-width:680px;">
      <h2 style="font-size:22px;font-weight:700;color:var(--text,#65515D);margin:0 0 6px;"><span data-zh="定制申请" data-en="Request a Commission">定制申请</span></h2>
      <p style="font-size:14px;color:var(--muted,#897783);margin:0 0 16px;line-height:1.7;"><span data-zh="想和柚子约稿/定制可以在这里申请。可以顺手挑好想用的手作素材（可选）——只是告诉柚子你想用什么材料，不代表购买素材哦 ♡" data-en="Tell Yuki about your commission idea. Optionally pick the handmade materials you'd like to use — this only tells Yuki your preferences, it does not purchase the materials ♡">想和柚子约稿/定制可以在这里申请。可以顺手挑好想用的手作素材（可选）——只是告诉柚子你想用什么材料，不代表购买素材哦 ♡</span></p>
      <div style="margin-bottom:12px;">
        <label style="font-size:15px;color:var(--text,#65515D);" data-zh="联系邮箱 *" data-en="Email *">联系邮箱 *</label>
        <input id="cf-email" type="email" style="width:100%;box-sizing:border-box;margin-top:6px;border:1.5px solid var(--card-border,#F9E5ED);border-radius:12px;padding:10px 14px;font-family:inherit;font-size:16px;color:var(--text,#65515D);outline:none;background:#fff;">
      </div>
      <div style="margin-bottom:12px;">
        <label style="font-size:15px;color:var(--text,#65515D);" data-zh="想定制什么？ *" data-en="What would you like? *">想定制什么？ *</label>
        <textarea id="cf-note" rows="4" style="width:100%;box-sizing:border-box;margin-top:6px;border:1.5px solid var(--card-border,#F9E5ED);border-radius:12px;padding:10px 14px;font-family:inherit;font-size:16px;color:var(--text,#65515D);resize:vertical;outline:none;background:#fff;"></textarea>
      </div>
      <div style="margin-bottom:14px;">
        <button type="button" id="cf-pick" class="home-long-btn" style="display:inline-block;padding:10px 22px;font-size:15px;"><span data-zh="＋ 选择手作素材（可选）" data-en="+ Pick materials (optional)">＋ 选择手作素材（可选）</span></button>
        <div id="cf-picked" style="margin-top:10px;"></div>
      </div>
      <button type="button" id="cf-send" class="home-long-btn" style="padding:12px 0;font-size:16px;"><span data-zh="提交申请" data-en="Submit Request">提交申请</span></button>
      <p id="cf-msg" style="font-size:14px;color:var(--muted,#897783);margin:10px 0 0;display:none;"></p>
    </div>
  </section>

  <!-- 素材选择弹层 -->
  <div id="cf-modal" style="display:none;position:fixed;inset:0;background:rgba(90,80,90,.4);z-index:400;align-items:center;justify-content:center;padding:20px;">
    <div style="background:var(--card,#FFFFFF);border-radius:18px;border:1.5px solid var(--card-border,#F9E5ED);width:min(760px,calc(100vw - 32px));max-height:86vh;overflow-y:auto;padding:22px 24px;position:relative;">
      <button type="button" id="cf-modal-x" style="position:absolute;top:14px;right:16px;border:none;background:none;font-size:20px;color:var(--muted,#897783);cursor:pointer;">✕</button>
      <h3 style="font-size:19px;color:var(--text,#65515D);margin:0 0 4px;" data-zh="选择手作素材" data-en="Pick materials">选择手作素材</h3>
      <p style="font-size:13px;color:var(--muted,#897783);margin:0 0 12px;" data-zh="可跨分类多选，也可以不选" data-en="Multi-select across categories, or skip entirely">可跨分类多选，也可以不选</p>
      <div id="cf-mat-chips" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;"></div>
      <div id="cf-mat-list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;"></div>
      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px;">
        <button type="button" id="cf-modal-ok" class="home-long-btn" style="display:inline-block;padding:10px 28px;"><span data-zh="完成" data-en="Done">完成</span></button>
      </div>
    </div>
  </div>

  <script>
  (function () {
    var L = (window.YK && window.YK.lang) || 'en';
    function t(zh, en) { return L === 'en' ? en : zh; }
    function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
    var CATS = ['转印贴', '3D模具', '布料'];
    var CAT_EN = { '转印贴': 'Transfer Stickers', '3D模具': '3D Molds', '布料': 'Fabrics' };
    var MATS = [], PICKED = [], CAT = '';
    var BASE = (window.DB_BASE || 'https://ukxrvcptwhlwvdanovgd.supabase.co/rest/v1/');
    var HDRS = window.DB_HEADERS || {};
    fetch(BASE + 'products?select=id,name,name_en,category,cover_zh,cover_en,image_url,images,price,variants&category=in.(' + encodeURIComponent('转印贴,3D模具,布料') + ')&order=created_at.desc&limit=100', { headers: HDRS })
      .then(function (r) { return r.ok ? r.json() : []; }).then(function (rows) { MATS = rows || []; })
      .catch(function () { MATS = []; });

    var sec = document.getElementById('commission-form-sec');
    if (!sec) return;
    var msg = document.getElementById('cf-msg');
    function showMsg(text, bad) { msg.style.display = 'block'; msg.textContent = text; msg.style.color = bad ? '#C4636E' : '#897783'; }
    function paintPicked() {
      var box = document.getElementById('cf-picked');
      box.innerHTML = PICKED.length ? '<b style="font-size:14px;color:#897783;">' + t('已选素材：', 'Picked:') + '</b>' + PICKED.map(function (m, i) {
        return '<span style="display:inline-flex;align-items:center;gap:6px;background:#FCECF2;border-radius:999px;padding:5px 12px;margin:4px 6px 0 0;font-size:14px;color:#65515D;">' + esc(m.name) +
          '<button type="button" data-rm="' + i + '" style="border:none;background:none;color:#C4636E;cursor:pointer;font-size:14px;">✕</button></span>';
      }).join('') : '';
      box.querySelectorAll('[data-rm]').forEach(function (b) {
        b.addEventListener('click', function () { PICKED.splice(parseInt(b.getAttribute('data-rm'), 10), 1); paintPicked(); });
      });
    }
    paintPicked();
    document.getElementById('cf-pick').addEventListener('click', openModal);
    function openModal() {
      var modal = document.getElementById('cf-modal');
      modal.style.display = 'flex';
      CAT = '';
      paintChips(); paintList();
    }
    function closeModal() { document.getElementById('cf-modal').style.display = 'none'; }
    function paintChips() {
      var box = document.getElementById('cf-mat-chips');
      box.innerHTML = [''].concat(CATS).map(function (c) {
        return '<button type="button" class="shop-mat-chip' + (CAT === c ? ' on' : '') + '" data-c="' + esc(c) + '">' + (c ? (L === 'en' ? CAT_EN[c] : c) : t('全部', 'All')) + '</button>';
      }).join('');
      box.querySelectorAll('[data-c]').forEach(function (b) {
        b.addEventListener('click', function () { CAT = b.getAttribute('data-c'); paintChips(); paintList(); });
      });
    }
    function paintList() {
      var box = document.getElementById('cf-mat-list');
      var rows = CAT ? MATS.filter(function (m) { return m.category === CAT; }) : MATS;
      if (!rows.length) { box.innerHTML = '<p style="font-size:14px;color:#897783;grid-column:1/-1;">' + t('这个分类还没有素材商品', 'No materials in this category yet') + '</p>'; return; }
      box.innerHTML = rows.map(function (m) {
        var cov = m.cover_zh || m.cover_en || (Array.isArray(m.images) && m.images[0]) || m.image_url || '';
        var on = PICKED.some(function (x) { return String(x.id) === String(m.id); });
        return '<div data-mid="' + esc(m.id) + '" style="cursor:pointer;border:1.5px solid ' + (on ? '#F6C5D7' : '#F9E5ED') + ';border-radius:14px;overflow:hidden;background:#fff;' + (on ? 'box-shadow:0 0 0 2px #F6C5D7;' : '') + '">' +
          (cov ? '<img src="' + esc(cov) + '" style="width:100%;aspect-ratio:1/1;object-fit:cover;display:block;" loading="lazy" alt="">' : '<div style="width:100%;aspect-ratio:1/1;background:#FCECF2;display:flex;align-items:center;justify-content:center;color:#B98598;">♡</div>') +
          '<div style="padding:8px 10px;"><b style="font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(L === 'en' ? (m.name_en || m.name) : m.name) + '</b>' +
          '<span style="font-size:12px;color:#897783;">' + esc(L === 'en' ? (CAT_EN[m.category] || m.category) : m.category) + (on ? ' · ✓' : '') + '</span></div>' +
        '</div>';
      }).join('');
      box.querySelectorAll('[data-mid]').forEach(function (card) {
        card.addEventListener('click', function () {
          var id = card.getAttribute('data-mid');
          var m = MATS.filter(function (x) { return String(x.id) === String(id); })[0];
          if (!m) return;
          var i = PICKED.findIndex(function (x) { return String(x.id) === String(id); });
          if (i > -1) PICKED.splice(i, 1);
          else PICKED.push({ id: m.id, name: (L === 'en' ? (m.name_en || m.name) : m.name), category: m.category, variant: '', qty: 1, image: (m.cover_zh || m.cover_en || m.image_url || '') });
          paintPicked(); paintList();
        });
      });
    }
    document.getElementById('cf-modal-x').addEventListener('click', closeModal);
    document.getElementById('cf-modal-ok').addEventListener('click', closeModal);
    document.getElementById('cf-modal').addEventListener('click', function (e) { if (e.target === this) closeModal(); });

    document.getElementById('cf-send').addEventListener('click', function () {
      var email = (document.getElementById('cf-email').value || '').trim();
      var note = (document.getElementById('cf-note').value || '').trim();
      if (!email || email.indexOf('@') < 1) { showMsg(t('请填写联系邮箱', 'Please enter your email'), true); return; }
      if (!note) { showMsg(t('写一句想定制什么吧', 'Tell Yuki what you would like'), true); return; }
      var btn = document.getElementById('cf-send');
      btn.disabled = true;
      var body = JSON.stringify({ email: email, note: note, materials: PICKED, status: 'pending' });
      fetch(BASE + 'commission_requests', { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, HDRS), body: body })
        .then(function (r) {
          btn.disabled = false;
          if (r.ok) {
            showMsg(t('申请已收到！柚子会通过邮箱回复你 ♡', 'Request received! Yuki will reply by email ♡'), false);
            document.getElementById('cf-note').value = '';
            PICKED = []; paintPicked();
          } else {
            return r.text().then(function (txt) {
              showMsg(/email/.test(txt) ? t('请填写联系邮箱', 'Please enter your email') : t('提交没有成功，稍后再试一次', 'Submit failed — try again later'), true);
            });
          }
        })
        .catch(function () { btn.disabled = false; showMsg(t('提交没有成功，稍后再试一次', 'Submit failed — try again later'), true); });
    });
  })();
  </script>
