  // 鑱旂郴涓婚鍒囨崲锛堢珯鍐呰嚜瀹氫箟鑳跺泭锛屼笉鐢ㄥ師鐢?select锛?  var TOPIC = 'product';
  var TOPIC_ZH = { product: '鍟嗗搧鍜ㄨ', order: '璁㈠崟闂', aftersale: '鍞悗涓庨€€娆?, site: '缃戠珯闂', other: '鍏朵粬' };
  var TOPIC_EN = { product: 'Product', order: 'Order', aftersale: 'After-sales', site: 'Website', other: 'Other' };
  document.getElementById('topic-chips').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    TOPIC = b.getAttribute('data-v') || 'product';
    Array.prototype.forEach.call(this.children, function (x) { x.classList.toggle('active', x === b); });
  });

  // 鍥炲鏂瑰紡鍒囨崲锛氬尶鍚?/ 鐣欎笅鑱旂郴鏂瑰紡
  var REPLY_MODE = 'anon';
  var MODE_HINTS = {
    anon: { zh: '鍖垮悕鐣欒█涓嶄細璁板綍浠讳綍鑱旂郴鏂瑰紡锛涙煔瀛愮殑鍥炲浼氭樉绀哄湪涓嬫柟鐣欒█澧欍€?, en: "Anonymous messages record no contact info; Yuki's replies are posted on the wall below." },
    contact: { zh: '浣犳彁渚涚殑鑱旂郴鏂瑰紡浠呯敤浜庡鐞嗗拰鍥炲杩欐潯鐣欒█锛屼笉浼氬叕寮€灞曠ず銆?, en: 'Your contact info is only used to handle and reply to this message and is never shown publicly.' }
  };
  document.getElementById('mode-chips').addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    this.querySelectorAll('button').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    REPLY_MODE = btn.getAttribute('data-v');
    document.getElementById('contact-fields').style.display = (REPLY_MODE === 'contact') ? '' : 'none';
    var h = MODE_HINTS[REPLY_MODE];
    document.getElementById('mode-hint').innerHTML = '<span data-zh="' + h.zh + '" data-en="' + h.en + '">' + t(h.zh, h.en) + '</span>';
  });
  // 鎻愪氦鐣欒█
  document.getElementById('q-send').addEventListener('click', function () {
    var btn = this;
    if (document.getElementById('q-honey').value) { return; } // 铚滅綈瀛楁锛氭満鍣ㄤ汉濉簡灏遍潤榛樹涪寮冿紝涓嶆彁绀轰笉鍐欏簱
    var text = document.getElementById('q-text').value.trim();
    var nickname = REPLY_MODE === 'contact' ? document.getElementById('q-nickname').value.trim() : '';
    var email = REPLY_MODE === 'contact' ? document.getElementById('q-email').value.trim() : '';
    var other = REPLY_MODE === 'contact' ? document.getElementById('q-other').value.trim() : '';
    if (!text) { toast(t('鍏堝啓鐐逛粈涔堝啀鎻愪氦鍝?, 'Write something first')); return; }
    if (REPLY_MODE === 'contact' && !nickname && !email && !other) {
      toast(t('閫変簡鐣欎笅鑱旂郴鏂瑰紡鐨勮瘽锛岃嚦灏戝～涓€绉嶅摝锛涗笉鎯崇暀鍙互鍒囧洖鍖垮悕鐣欒█', 'Pick 鈥淟eave Contact Info鈥? Fill in at least one 鈥?or switch back to Anonymous')); return;
    }
    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { toast(t('Email 鏍煎紡濂藉儚涓嶅お瀵?, 'That email looks invalid')); return; }
    try { // 闃插埛锛?0 绉掑唴鍙厑璁告彁浜や竴娆?      var last = parseInt(localStorage.getItem('yuki-last-ask') || '0', 10);
      if (Date.now() - last < 30000) { toast(t('鍒氬垰宸茬粡鎻愪氦杩囧暒锛岀◢绛変竴涓嬪啀鍙?, 'Just sent one 鈥?please wait a moment')); return; }
    } catch (err) {}
    var hasContact = !!(nickname || email || other);
    btn.disabled = true;
    btn.textContent = t('鎻愪氦涓€?, 'Sending鈥?);
    // 璧版湇鍔＄ RPC锛坰ecurity definer锛夛細涓€娆′簨鍔″啓鐣欒█+鑱旂郴鏂瑰紡锛屽苟杩斿洖鏂扮暀瑷€ id锛?    // 涓嶈兘鐢?REST 鐩存彃 + Prefer:return=representation锛堝叕寮€璇荤瓥鐣ュ彧鏀捐宸插洖澶嶈锛屾柊琛屽洖璇讳細琚嫆锛岃繖鏄棫鎻愰棶绠扁€滄彁浜ゅけ璐モ€濈殑鑰?bug锛?    api('rpc/askbox_submit', {
      method: 'POST',
      body: JSON.stringify({
        p_content: text,
        p_topic: TOPIC,
        p_nickname: nickname || null,
        p_email: email || null,
        p_other_contact: other || null
      })
    }).then(function (r) {
      if (!r.ok) throw new Error('rpc failed');
      return r.json();
    }).then(function (newId) {
      // 璁颁綇鏈満鍙戝嚭鍘荤殑鐣欒█锛堝尶鍚嶄笉缁戣处鍙凤紝鍙湪鏈満銆屽彂鍑哄幓鐨勭暀瑷€銆嶉噷灞曠ず锛?      try {
        if (newId) {
          var ids = JSON.parse(localStorage.getItem('yuki-my-questions') || '[]');
          if (Array.isArray(ids) && ids.indexOf(newId) === -1) { ids.push(newId); localStorage.setItem('yuki-my-questions', JSON.stringify(ids.slice(-100))); }
        }
      } catch (e) {}
    }).then(function () {
      try { localStorage.setItem('yuki-last-ask', String(Date.now())); } catch (err) {}
      toast(hasContact
        ? t('鎻愪氦鎴愬姛锛佹煔瀛愪細灏藉揩鍥炲浣?, 'Sent! Yuki will get back to you soon')
        : t('鎻愪氦鎴愬姛锛佺敱浜庢病鏈夌暀鑱旂郴鏂瑰紡锛屽洖澶嶄細鏄剧ず鍦ㄤ笅鏂圭暀瑷€澧?, 'Sent! Replies will be posted on the wall below'));
      document.getElementById('q-text').value = '';
      document.getElementById('q-nickname').value = '';
      document.getElementById('q-email').value = '';
      document.getElementById('q-other').value = '';
      loadWall();
    }).catch(function () {
      toast(t('鎻愪氦澶辫触锛岀◢鍚庡啀璇曡瘯', 'Failed to send, please try again later'));
    }).finally(function () {
      btn.disabled = false;
      btn.innerHTML = '<span data-zh="鎻愪氦鐣欒█" data-en="Send Message">' + t('鎻愪氦鐣欒█', 'Send Message') + '</span>';
    });
  });

  // 鍥炵瓟澧?  function loadWall() {
    api('questions?select=id,content,topic,reply,created_at,replied_at&order=created_at.desc&limit=100')
      .then(function (r) { return r.json(); })
      .then(function (rows) {
        var list = document.getElementById('qa-list');
        if (!rows || !rows.length) {
          list.innerHTML = '<p class="empty">' + t('杩樻病鏈変汉鎶曢€掞紝鏉ュ仛绗竴涓惂', 'No messages yet 鈥?be the first!') + '</p>';
          return;
        }
        list.innerHTML = rows.map(function (q) {
          var topic = t(TOPIC_ZH[q.topic] || TOPIC_ZH.other, TOPIC_EN[q.topic] || TOPIC_EN.other);
          var replyHtml = q.reply
            ? '<div class="qa-reply"><span class="reply-label">' + t('鏌氬瓙 鍥炲锛?, 'Yuki replied:') + '</span>' + esc(q.reply) + '</div>'
            : '<div class="qa-pending">' + t('宸叉敹鍒帮紝绛夋煔瀛愬洖澶嶅摝锝?, 'Received! Yuki will reply soon~') + '</div>';
          return '<div class="qa">' +
            '<div class="qa-q">' + esc(q.content) + '</div>' +
            '<div class="qa-meta">' + t('涓婚锛?, 'Topic: ') + esc(topic) + ' 路 ' + t('鍖垮悕', 'Anonymous') + ' 路 ' + fmtTime(q.created_at) + '</div>' +
            replyHtml + '</div>';
        }).join('');
      })
      .catch(function () {
        document.getElementById('qa-list').innerHTML =
          '<p class="empty">' + t('鍔犺浇澶辫触锛岃绋嶅悗鍒锋柊閲嶈瘯', 'Failed to load, please refresh') + '</p>';
      });
  }
  applyLang(LANG);
  loadWall();
</script>
