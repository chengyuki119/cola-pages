<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
  <script src="/js/lang-path.js?v=20261031h"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物流查询 · Snow Yuzu</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="/icon-yuki2-180.png">
<link rel="icon" type="image/png" sizes="180x180" href="/icon-yuki2-180.png">
<meta name="apple-mobile-web-app-title" content="小柚的小世界">
<link rel="stylesheet" href="/css/site.css?v=20261031h">
<link rel="stylesheet" href="/site-menu.css?v=20261031h">
<script src="/site-menu.js?v=20261031h" defer></script>
<style>
  .track-wrap { max-width: 760px; margin: 0 auto; padding: 40px 24px 64px; }
  .track-sub { color: var(--muted,#A88E9B); font-size: 15px; margin: 0 0 20px; }
  .track-search { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; }
  .track-search input { flex: 1; min-width: 220px; padding: 12px 18px; font-size: 16px; border: 1.5px solid #FFD9E6; border-radius: 14px; outline: none; font-family: inherit; color: #604C57; background: #fff; }
  .track-search input:focus { border-color: #f3a8c5; }
  .track-search button { padding: 12px 30px; font-size: 16px; font-weight: 600; border: none; border-radius: 999px; background: #FFD9E6; color: #604C57; cursor: pointer; font-family: inherit; }
  .track-search button:hover { background: #FCE4EC; }
  .track-meta { background: #fff; border: 1px solid #F3DDE5; border-radius: 16px; box-shadow: 0 2px 10px rgba(180,120,150,.12); padding: 18px 22px; margin-bottom: 22px; }
  .track-meta .tm-row { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; font-size: 15px; color: #604C57; }
  .track-meta .tm-row b { font-weight: 700; text-align: right; }
  .track-status { display: inline-block; background: #FCE4EC; color: #604C57; font-size: 13px; font-weight: 600; padding: 3px 14px; border-radius: 999px; }
  .tl { list-style: none; margin: 0; padding: 0 0 0 6px; }
  .tl li { position: relative; padding: 0 0 22px 26px; }
  .tl li::before { content: ''; position: absolute; left: 5px; top: 8px; bottom: -4px; width: 2px; background: #FFD9E6; }
  .tl li:last-child::before { display: none; }
  .tl li::after { content: ''; position: absolute; left: 0; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 3px solid #f3a8c5; box-sizing: border-box; }
  .tl li.latest::after { background: #FF6FA5; border-color: #FF6FA5; }
  .tl .tl-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .tl .tl-status { font-size: 16px; font-weight: 700; color: #604C57; }
  .tl .tl-time { font-size: 13px; color: #A88E9B; }
  .tl .tl-place { font-size: 13px; color: #A88E9B; }
  .tl .tl-note { font-size: 15px; line-height: 1.7; color: #604C57; margin: 4px 0 0; word-break: break-word; overflow-wrap: anywhere; }
  .track-sim { background: #FFF0C2; border: 1.5px solid #E8C96A; color: #7A5B00; border-radius: 12px; padding: 10px 14px; font-size: 13px; font-weight: 700; letter-spacing: .5px; line-height: 1.6; margin-bottom: 16px; text-align: center; word-break: break-word; }
  .track-empty { text-align: center; padding: 34px 18px; color: var(--muted,#A88E9B); font-size: 16px; }
  .track-empty .big { font-size: 34px; margin-bottom: 10px; }
  @media (max-width: 520px) { .track-wrap { padding: 30px 16px 56px; } .track-meta { padding: 15px 16px; } }
</style>
  <link rel="stylesheet" href="/css/button-theme.css?v=20261031h">
</head>
<body>
<header class="topbar">
  <div class="lang-switch">
    <button class="lang-btn" data-lang="zh">简体中文</button>
    <button class="lang-btn" data-lang="en">English</button>
  </div>
  <a class="site-logo" href="/zh/" aria-label="回主页"><img src="/logo.png" alt="logo"></a>
  <div class="topbar-right">
    <a class="topbar-cart" id="topbar-cart" href="/zh/shop/?sec=cart" aria-label="购物车">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2.5 3.5h2.2l2.3 11.2a1.8 1.8 0 0 0 1.8 1.4h8.5a1.8 1.8 0 0 0 1.8-1.4l1.5-8.2H6"/></svg>
      <span class="topbar-cart-badge" id="topbar-cart-badge" style="display:none;">0</span>
    </a>
    <button class="burger" id="burger" aria-label="菜单">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
<div class="menu-mask" id="menu-mask"></div>
<nav class="menu" id="menu"></nav>

<header class="subpage-header">
  <h1 class="subpage-title" data-zh="物流查询 ♡" data-en="Package Tracking ♡">物流查询 ♡</h1>
  <p class="track-sub" data-zh="输入运单号，看看你的小包裹走到哪里啦～" data-en="Enter a tracking number to see where your little package is~">输入运单号，看看你的小包裹走到哪里啦～</p>
</header>
<div class="track-wrap">
  <a class="back-link page-back" href="/zh/" style="margin:8px 0 24px 2px;"><span data-zh="← 返回主页" data-en="← Back to Home">← 返回主页</span></a>
  <div class="track-search">
    <input id="track-no" placeholder="运单号 / Tracking number" autocomplete="off">
    <button id="track-go" data-zh="查一查 ♡" data-en="Track ♡">查一查 ♡</button>
  </div>
  <div id="track-result">
    <div class="track-empty"><div class="big">～ ☆</div><span data-zh="还没有查询结果，输入运单号试试吧" data-en="No results yet — enter a tracking number above">还没有查询结果，输入运单号试试吧</span></div>
  </div>
</div>

<footer></footer>

<script src="/js/site-common.js?v=20261031h"></script>
<script src="/js/site-footer.js?v=20261031h"></script>
<script>
(function () {
  'use strict';
  var SUPABASE_URL = 'https://ukxrvcptwhlwvdanovgd.supabase.co';
  var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVreHJ2Y3B0d2hsd3ZkYW5vdmdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMzgyNDcsImV4cCI6MjEwODgxNDI0N30.Grdi23yToGPFF8e_kxFjf37JOOf51j-FW_FYQTUVu8E';
  function t(zh, en) { return (window.LANG === 'en') ? en : zh; }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function fmtTime(iso) {
    if (!iso) return '—';
    try { return new Date(iso).toLocaleString(window.LANG === 'en' ? 'en-US' : 'zh-CN', { hour12: false }); } catch (e) { return iso; }
  }
  function lookup(no) {
    var box = document.getElementById('track-result');
    no = String(no || '').trim();
    if (!no) return;
    box.innerHTML = '<div class="track-empty">' + t('正在查询…', 'Searching…') + '</div>';
    fetch(SUPABASE_URL + '/rest/v1/mock_tracking?select=*&tracking_no=eq.' + encodeURIComponent(no) + '&order=step.asc', {
      headers: { 'apikey': ANON, 'Authorization': 'Bearer ' + ANON }
    }).then(function (r) { return r.json(); }).then(function (rows) {
      rows = Array.isArray(rows) ? rows : [];
      if (!rows.length) {
        box.innerHTML = '<div class="track-empty"><div class="big">～ ☆</div>'
          + t('没有找到「' + esc(no) + '」的物流记录，检查一下单号有没有写对呀～', 'No tracking records found for "' + esc(no) + '" — please double-check the number~')
          + '</div>';
        return;
      }
      var zh = window.LANG !== 'en';
      var last = rows[rows.length - 1];
      var simBanner = /^TEST-/.test(no) ? '<div class="track-sim">测试数据 · SIMULATED TRACKING — NOT A REAL SHIPMENT<br><span style="font-weight:400;">此单号为虚拟物流测试记录，不会出现在任何真实包裹上</span></div>' : '';
      var meta = simBanner + '<div class="track-meta">'
        + '<div class="tm-row"><span>' + t('运单号', 'Tracking No.') + '</span><b>' + esc(no) + '</b></div>'
        + '<div class="tm-row"><span>' + t('最新状态', 'Latest status') + '</span><b><span class="track-status">' + esc(zh ? (last.status_zh || last.status_en || '—') : (last.status_en || last.status_zh || '—')) + '</span></b></div>'
        + '<div class="tm-row"><span>' + t('当前位置', 'Current location') + '</span><b>' + esc(last.place || '—') + '</b></div>'
        + '<div class="tm-row"><span>' + t('更新时间', 'Updated') + '</span><b>' + fmtTime(last.at) + '</b></div>'
        + '</div>';
      var steps = rows.map(function (r, i) {
        var isLatest = i === rows.length - 1;
        return '<li class="' + (isLatest ? 'latest' : '') + '">'
          + '<div class="tl-head"><span class="tl-status">' + esc(zh ? (r.status_zh || r.status_en) : (r.status_en || r.status_zh)) + '</span>'
          + '<span class="tl-time">' + fmtTime(r.at) + '</span>'
          + (r.place ? '<span class="tl-place">· ' + esc(r.place) + '</span>' : '') + '</div>'
          + (zh ? (r.note_zh || r.note_en || '') : (r.note_en || r.note_zh || '')) .replace(/^/, '<p class="tl-note">').replace(/$/, '</p>')
          + '</li>';
      }).join('');
      box.innerHTML = meta + '<ul class="tl">' + steps + '</ul>'
        + '<p style="font-size:13px;color:var(--muted,#A88E9B);margin:14px 0 0;">' + t('测试数据仅供参考 · 真实包裹请以承运商官方信息为准', 'Simulated data for testing only · real shipments follow the carrier\'s official info') + '</p>';
    }).catch(function () {
      box.innerHTML = '<div class="track-empty">' + t('查询失败，稍后再试试呀～', 'Search failed — please try again later~') + '</div>';
    });
  }
  document.getElementById('track-go').addEventListener('click', function () { lookup(document.getElementById('track-no').value); });
  document.getElementById('track-no').addEventListener('keydown', function (e) { if (e.key === 'Enter') lookup(this.value); });
  // URL 带 ?no= 直接查
  var q = new URLSearchParams(location.search).get('no');
  if (q) { document.getElementById('track-no').value = q; lookup(q); }
  // 语言切换时刷新结果
  document.addEventListener('click', function (e) {
    var btn = e.target && e.target.closest ? e.target.closest('.lang-btn') : null;
    if (!btn) return;
    setTimeout(function () {
      var no = document.getElementById('track-no').value;
      if (no.trim()) lookup(no);
      else document.querySelector('.track-empty span') && applyLang && applyLang(window.LANG);
    }, 60);
  });
})();
</script>
</body>
</html>
