<!DOCTYPE html>
<html><head><meta charset="utf-8"></head><body>
<iframe id="f" src="/photos/index.html" style="width:1280px;height:900px;"></iframe>
<pre id="out">running</pre>
<script>
setTimeout(() => {
  const d = document.getElementById('f').contentDocument;
  const w = document.getElementById('f').contentWindow;
  const r = {};
  // 1. instax 图打开
  const img1 = d.querySelector('#sec-instax .album-item .album-img img');
  img1.click();
  setTimeout(() => {
    const lb = d.getElementById('lightbox');
    r.open1 = lb.classList.contains('open');
    r.dl1 = d.getElementById('lightbox-download').getAttribute('href');
    r.dlAttr = d.getElementById('lightbox-download').getAttribute('download');
    // 2. Escape 关闭
    d.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    setTimeout(() => {
      r.escClosed = !lb.classList.contains('open');
      // 3. film 图打开（覆盖 film 分区）
      const img2 = d.querySelector('#sec-film .album-item .album-img img');
      img2.click();
      setTimeout(() => {
        r.open2 = lb.classList.contains('open');
        r.dl2 = d.getElementById('lightbox-download').getAttribute('href');
        r.infoText = d.getElementById('lightbox-info').textContent.slice(0, 30);
        // 4. 关闭按钮
        d.getElementById('lightbox-close').click();
        setTimeout(() => {
          r.btnClosed = !lb.classList.contains('open');
          // 5. 点灯箱背景也能关
          d.getElementById('lightbox').dispatchEvent(new w.MouseEvent('click', { bubbles: true }));
          setTimeout(() => {
            r.bgClosed = !lb.classList.contains('open');
            document.getElementById('out').textContent = 'RESULT ' + JSON.stringify(r);
          }, 300);
        }, 300);
      }, 400);
    }, 300);
  }, 400);
}, 6000);
</script>
</body></html>
