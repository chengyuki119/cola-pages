<!DOCTYPE html>
<html lang="zh-CN">
<!--
  ═══════════════════════════════════════════════
  自己动手改这里（用任意文本编辑器打开本文件即可）：

  1. 名字/签名：搜索「Yuki」和「欢迎食用」改成你的
  2. 头像：文件名 avatar.jpg（放同文件夹即自动显示）
  3. 封面背景图：文件名 cover.jpg（放同文件夹即自动显示）
  4. 社交链接：搜索 class="link-card"，改 href 和账号名；
     微信卡片点击自动复制微信号，号码在 JS 里的 WECHAT_ID 处改
  5. 主页精选图：各 4 张，photos/vct1~4.jpg 和 photos/bjd1~4.jpg
  6. 子页面全部照片：photos/vct5.jpg、vct6.jpg… 一直排下去，
     文件存在就自动显示（子页面已预留到 12 张，更多就复制一行 div 改编号）

  改完保存，刷新浏览器就能看到效果。
  ═══════════════════════════════════════════════
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Cards · Yuki / 柚子</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="/icon-app-180.png">
<link rel="icon" type="image/png" sizes="180x180" href="/icon-app-180.png">
<meta name="apple-mobile-web-app-title" content="小柚的小世界">
<link rel="stylesheet" href="/css/site.css">
  <link rel="stylesheet" href="/site-menu.css">
    <script src="/site-menu.js" defer></script>
</head>
<body>

<!-- 顶部白色长条：左边切换语言，中间 logo 点击回主页，右边菜单 -->
<header class="topbar">
  <div class="lang-switch">
    <button class="lang-btn" data-lang="zh">简体中文</button>
    <button class="lang-btn" data-lang="en">English</button>
  </div>
  <a class="site-logo" href="/" aria-label="回主页"><img src="/logo.png" alt="logo"></a>
  <button class="burger" id="burger" aria-label="菜单">
    <span></span><span></span><span></span>
  </button>
</header>
<div class="menu-mask" id="menu-mask"></div>
<nav class="menu" id="menu"></nav>

<div class="page active" id="page-color-card">
  <div id="cards-list-page">
  <div class="subpage-header">
    <a class="back-link" href="/"><span data-zh="← 返回主页" data-en="← Back to Home">← 返回主页</span></a>
    <h1 class="subpage-title" data-zh="色卡" data-en="Color Cards">色卡</h1>
    <p class="subpage-sub" data-zh="原创圈我的色卡宝宝们" data-en="My color card babies">原创圈我的色卡宝宝们</p>
  </div>
  <div class="page-body album-body" style="padding-top:0;">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;">
      <span style="font-size:13px;color:var(--muted);" data-zh="筛选与排序" data-en="Filter & Sort">筛选与排序</span>
      <select id="card-filter"><option value="all" data-en="All">全部</option></select>
      <select id="card-sort">
        <option value="manual" data-en="Manual (default)">默认排序</option>
        <option value="dateDesc" data-en="Purchase date newest → oldest">购入日期 最新 → 最旧</option>
        <option value="dateAsc" data-en="Purchase date oldest → newest">购入日期 最旧 → 最新</option>
        <option value="priceDesc" data-en="Price high → low">价格 高 → 低</option>
        <option value="priceAsc" data-en="Price low → high">价格 低 → 高</option>
        <option value="countDesc" data-en="Sheet count high → low">张数 多 → 少</option>
        <option value="countAsc" data-en="Sheet count low → high">张数 少 → 多</option>
        <option value="nameAsc" data-en="Name A → Z">名称 A → Z</option>
        <option value="nameDesc" data-en="Name Z → A">名称 Z → A</option>
      </select>
    </div>
    <style>
      /* 手机端与 BJD 页卡片完全同套尺寸逻辑（bjd-size-grid：minmax(170px,1fr) + gap 10px）；桌面保持 200px */
      #cards-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
      @media (max-width:640px) { #cards-grid { grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:10px; } }
    </style>
    <div id="cards-grid"></div>
  </div>
  </div>
  <div id="card-page-view" style="display:none;">
  <div class="subpage-header">
    <a class="back-link" href="/color-card/"><span data-zh="← 返回色卡列表" data-en="← Back to Color Cards">← 返回色卡列表</span></a>
    <h1 class="subpage-title" id="card-view-title" data-zh="色卡详情" data-en="Color Card Details">色卡详情</h1>
    <p class="subpage-sub" data-zh="原创圈我的色卡宝宝们" data-en="My color card babies">原创圈我的色卡宝宝们</p>
  </div>
  <div class="page-body album-body" style="padding-top:0;">
    <div id="card-view-body"></div>
  </div>
  </div>
</div>
<div id="share-pop"></div>
<div class="toast" id="toast"></div>
<script src="/js/site-common.js"></script>
<script>
  // ===== 色卡：独立子页（列表 + 详情 /color-card/?card=N）=====
  var CURRENT_CARD = -1;
  var CARD_FILTER = 'all', CARD_SORT = 'manual';
  // 子页动态下拉：数据就绪后重建 sel 增强（site-common 只在载入时增强一次）
  function refreshSubSelects() {
    ['card-filter', 'card-sort'].forEach(function (id) {
      var sel = document.getElementById(id);
      if (!sel) return;
      Array.prototype.slice.call(sel.parentNode.children).forEach(function (el) {
        if (el !== sel && (el.classList.contains('sel-btn') || el.classList.contains('sel-menu'))) el.parentNode.removeChild(el);
      });
      sel.removeAttribute('data-enh');
      sel.style.display = '';
    });
    if (window.enhanceSelects) enhanceSelects();
  }
  function renderCardsList() {
    var cGrid = document.getElementById('cards-grid');
    if (!cGrid) return;
    var list = CARDS_CACHE.map(function (c, i) { return { c: c, i: i }; });
    if (CARD_FILTER !== 'all') list = list.filter(function (x) { return (x.c.artists || []).some(function (a) { return a.name === CARD_FILTER; }); });
    var boughtOf = function (x) { return x.c.bought || ''; };
    if (CARD_SORT === 'dateDesc' || CARD_SORT === 'dateAsc') {
      list.sort(function (a, b) {
        var av = boughtOf(a), bv = boughtOf(b);
        if (!av && !bv) return 0; if (!av) return 1; if (!bv) return -1; // 没填日期的排最后
        return CARD_SORT === 'dateDesc' ? bv.localeCompare(av) : av.localeCompare(bv);
      });
    }
    if (CARD_SORT === 'priceDesc') list.sort(function (a, b) { return cardFinalV(b.c) - cardFinalV(a.c); });
    if (CARD_SORT === 'priceAsc') list.sort(function (a, b) { return cardFinalV(a.c) - cardFinalV(b.c); });
    if (CARD_SORT === 'countDesc') list.sort(function (a, b) { return cardCountV(b.c) - cardCountV(a.c); });
    if (CARD_SORT === 'countAsc') list.sort(function (a, b) { return cardCountV(a.c) - cardCountV(b.c); });
    if (CARD_SORT === 'nameAsc') list.sort(function (a, b) { return (a.c.name || '').localeCompare(b.c.name || '', 'zh-Hans-CN'); });
    if (CARD_SORT === 'nameDesc') list.sort(function (a, b) { return (b.c.name || '').localeCompare(a.c.name || '', 'zh-Hans-CN'); });
    if (!CARDS_CACHE.length) {
      cGrid.style.display = 'block';
      cGrid.innerHTML = '<p style="color:var(--muted);text-align:center;padding:40px 0;font-size:14px;">' + t('还没有色卡，去后台「色卡管理」新建吧', 'No color cards yet. Create one in the admin panel.') + '</p>';
      return;
    }
    cGrid.style.display = 'grid';
    cGrid.innerHTML = list.length ? list.map(function (x) {
      var c = x.c, i = x.i;
      return '<div class="card sc-product" data-i="' + i + '" style="margin-bottom:0;padding:0;overflow:hidden;cursor:pointer;position:relative;">' +
        (c.image ? '<div style="width:100%;aspect-ratio:1/1;overflow:hidden;background:var(--card);"><img src="' + escAttrDb(normImg(c.image)) + '" style="width:100%;height:100%;object-fit:cover;display:block;" alt="色卡"></div>' : '') +
        '<div style="padding:12px 14px;">' +
        '<div style="display:flex;align-items:center;gap:8px;">' +
        '<b style="flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escDb(c.name || t('未命名色卡', 'Unnamed card')) + '</b>' +
        shareBtnHtml(i, null, true) +
        '</div>' +
        (c.shop ? '<div style="font-size:12px;color:var(--muted);margin-top:2px;">' + escDb(c.shop) + '</div>' : '') +
        '<div style="font-size:12px;color:var(--muted);margin-top:3px;">' + (LANG === 'en' ? cardCountV(c) + ' cards · ' + c.artists.length + ' artists' : '画师 ' + c.artists.length + ' 位 · 共 ' + cardCountV(c) + ' 张') + '</div>' +
        '<div style="display:flex;align-items:center;gap:8px;margin-top:4px;">' +
        '<span style="flex:1;font-size:14px;color:var(--accent);font-weight:600;">总价 ¥' + fmtMoney(cardFinalV(c)) + '</span>' +
        cardEditBtn(i) +
        '</div>' +
        '</div></div>';
    }).join('') : '<p style="color:var(--muted);text-align:center;padding:40px 0;font-size:14px;">没有符合筛选条件的色卡</p>';
  }
  document.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'card-filter') { CARD_FILTER = e.target.value; renderCardsList(); }
    if (e.target && e.target.id === 'card-sort') { CARD_SORT = e.target.value; renderCardsList(); }
  });
  function renderCardView() {
    var body = document.getElementById('card-view-body');
    var c = CARDS_CACHE[CURRENT_CARD];
    if (!body) return;
    if (!c) { body.innerHTML = '<p style="color:var(--muted);text-align:center;padding:40px 0;">' + t('没有找到这张色卡', 'Card not found') + '</p>'; return; }
    var title = document.getElementById('card-view-title');
    if (title) title.textContent = c.name || t('未命名色卡', 'Unnamed card');
    var priceLines = c.artists.map(function (a, i) {
      var rows = a.rows.map(function (r) {
        return '<div class="sc-row">' +
          '<span>' + escDb(r.label || t('其他', 'Other')) + '</span>' +
          '<span style="text-align:right;">¥' + (r.price == null ? '' : escDb(r.price)) + '</span>' +
          '<span class="r-x">×</span>' +
          '<span style="text-align:right;">' + (parseInt(r.qty, 10) || 0) + '</span>' +
          '<span class="r-eq">=</span>' +
          '<b class="r-total">¥' + fmtMoney(rowTotalV(r)) + '</b>' +
          '</div>';
      }).join('');
      return '<div style="margin-bottom:' + (i === c.artists.length - 1 ? '0' : '16px') + ';">' +
        '<div style="font-size:12px;color:var(--muted);margin-bottom:4px;">画师 ' + (i + 1) + '</div>' +
        '<b style="font-size:14px;display:block;margin-bottom:8px;">' + escDb(a.name || (t('画师 ', 'Artist ') + (i + 1))) + '</b>' +
        rows +
        '<div style="border-top:1px solid var(--card-hover);margin-top:8px;padding-top:8px;font-size:13px;color:var(--muted);">' + labelAggV(a) + ' · ' + (LANG === 'en' ? 'Total ' + artistCountV(a) + ' cards · Subtotal ' : '共 ' + artistCountV(a) + ' 张 · 小计 ') + '<b style="color:var(--accent);">¥' + fmtMoney(artistSubV(a)) + '</b></div>' +
        '</div>';
    }).join('');
    body.innerHTML =
      (c.image ? '<div style="width:100%;max-width:420px;aspect-ratio:1/1;margin:0 auto 18px;overflow:hidden;border-radius:var(--radius);background:var(--card);"><img src="' + escAttrDb(normImg(c.image)) + '" style="width:100%;height:100%;object-fit:cover;display:block;" alt="色卡"></div>' : '') +
      '<div style="text-align:center;margin-bottom:18px;">' +
      '<span style="font-size:18px;font-weight:700;">' + escDb(c.name || t('未命名色卡', 'Unnamed card')) + '</span>' +
      (c.shop ? '<span style="color:var(--muted);font-size:14px;">　|　' + escDb(c.shop) + '</span>' : '') +
      '</div>' +
      '<div style="text-align:center;margin-bottom:18px;"><span style="font-size:20px;font-weight:700;color:var(--accent);">' + t('色卡最终总金额', 'Card final total') + ' ¥' + fmtMoney(cardFinalV(c)) + '</span><span style="color:var(--muted);font-size:14px;margin-left:14px;">' + (LANG === 'en' ? 'Total ' + cardCountV(c) + ' cards' : '色卡总数 ' + cardCountV(c) + ' 张') + '</span></div>' +
      '<div class="card" style="padding:18px 20px;margin-bottom:14px;">' +
      '<h2 style="font-size:16px;">' + t('私调明细', 'Custom Details') + '</h2>' +
      (c.origPrice != null && c.origPrice !== '' ?
        '<div style="display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--card-hover);padding-bottom:10px;margin-bottom:14px;">' +
        '<span style="font-size:14px;color:var(--muted);">' + t('色卡购入价', 'Card purchase price') + '</span>' +
        '<b style="font-size:15px;">¥' + fmtMoney(c.origPrice) + '</b>' +
        '</div>' : '') +
      priceLines +
      '<div style="border-top:1px solid var(--card-hover);margin-top:12px;padding-top:10px;display:flex;align-items:center;justify-content:space-between;">' +
      '<span style="font-size:15px;font-weight:700;">' + t('色卡最终总金额', 'Card final total') + '</span>' +
      '<b style="font-size:17px;color:var(--accent);">¥' + fmtMoney(cardFinalV(c)) + '</b>' +
      '</div>' +
      '</div>';
  }

  // 数据：与后台同一份
  dbFetch('site_settings?select=key,value&limit=100').then(function (rows) {
    var S = {};
    (rows || []).forEach(function (r) { S[r.key] = r.value; });
    var cardsRaw = null;
    try { cardsRaw = JSON.parse(S['cards'] || 'null'); } catch (e) {}
    var cardsList = Array.isArray(cardsRaw) ? cardsRaw : (cardsRaw && cardsRaw.artists ? cardsRaw.artists : []);
    CARDS_CACHE = cardsList.map(function (c) { return normCardView(c); });
    // 筛选选项：按画师（现有数据无分类/标签字段，只做全部/按画师）
    var artistNames = [];
    CARDS_CACHE.forEach(function (c) { (c.artists || []).forEach(function (a) { if (a.name && artistNames.indexOf(a.name) === -1) artistNames.push(a.name); }); });
    var fsel = document.getElementById('card-filter');
    fsel.innerHTML = '<option value="all" data-en="All">' + t('全部', 'All') + '</option>' + artistNames.map(function (n) {
      return '<option value="' + escAttrDb(n) + '" data-en="Artist: ' + escAttrDb(n) + '">' + t('画师：', 'Artist: ') + escDb(n) + '</option>';
    }).join('');
    refreshSubSelects();
    renderCardsList();
    // ?card=N → 直接打开色卡详情
    var card = new URLSearchParams(location.search).get('card');
    if (card != null && !isNaN(parseInt(card, 10))) {
      CURRENT_CARD = parseInt(card, 10);
      document.getElementById('cards-list-page').style.display = 'none';
      document.getElementById('card-page-view').style.display = '';
      renderCardView();
    }
  }).catch(function () {});

  document.getElementById('cards-grid').addEventListener('click', function (e) {
    if (e.target.closest('.share-btn')) return; // 分享按钮自己处理
    var eb = e.target.closest('.card-edit-btn');
    if (eb) { // 编辑卡：直接进入后台的编辑色卡（按 card_id）
      try { sessionStorage.setItem('admin-edit-card', eb.getAttribute('data-edit-card')); } catch (err) {}
      location.href = '/admin.html#cards';
      return;
    }
    var pc = e.target.closest('.sc-product');
    if (pc) location.href = '/color-card/?card=' + pc.getAttribute('data-i');
  });
  if (window.SiteMenu) SiteMenu.notify('cards');
  applyLang(LANG);
</script>

</body>
</html>
