  :root {

    --accent-strong: #A04A68;
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Millo Body", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6;

  button { font-family: inherit; }

  /* ===== 顶部白色长条 + 汉堡菜单（与主页一致）===== */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 60px;
    background: #ffffff;
    box-shadow: 0 2px 12px rgba(255,143,171,.18);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
  }
  .lang-switch {
    display: flex;
    gap: 4px;
    background: var(--accent-soft, #FCE4EC); /* 20261026s 她指定款：粉胶囊底座+白胶囊选中（全站同款） */
    padding: 4px;
    border-radius: 999px;
  }
  .lang-btn {
    border: none;
    background: transparent;
    font-size:15px;
    padding: 5px 12px;
    border-radius: 999px;
    cursor: pointer;
    color: var(--muted);
    transition: background .2s, color .2s, box-shadow .2s;
  }
  .lang-btn.active { background: #ffffff; color: var(--text, #604C57); font-weight: 600; box-shadow: 0 1px 4px rgba(180,120,150,.28); } /* 20261026s 白胶囊浮起（她截图指定，前台后台同款） */
  .wrap { max-width: 1000px; margin: 0 auto; padding: 48px 24px 64px; }
  .back-link {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--text);
    font-size:17px;
    padding: 8px 14px; border-radius: 999px;
    background: var(--card);
    transition: background .2s;
  }
  .back-link:hover { background: var(--card-hover); }
  h1 { font-size:31px; margin: 20px 0 6px; }
  .sub { color: var(--muted); font-size:17px; margin-bottom: 24px; }

  .ask-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 18px;
    display: flex; flex-direction: column;
    margin-bottom: 40px;
  }
  .ask-card textarea {
    width: 100%; min-height: 110px;
    border: 1px solid #FFD9E6; border-radius: 12px;
    background: #FFF8FA; padding: 12px 14px;
    font-family: inherit; font-size:17px;
    color: var(--text); line-height: 1.6;
    resize: none; outline: none; box-sizing: border-box;
  }
  .ask-card textarea::placeholder { color: var(--muted); }
  .ask-card input {
    margin-top: 10px;
    border: none; border-radius: 12px;
    background: #fff; padding: 10px 14px;
    font-family: inherit; font-size:16px;
    color: var(--text); outline: none;
  }
  .ask-card input::placeholder { color: var(--muted); }
  .f-label { display: block; font-size: 14px; color: var(--muted); margin: 14px 0 0; }
  .f-label:first-of-type { margin-top: 0; }
  .topic-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .ask-card .topic-chips button {
    border: none; border-radius: 999px;
    background: #fff; color: var(--text, #604C57);
    font-family: inherit; font-size:16px; padding: 7px 16px;
    cursor: pointer; transition: background .15s, color .15s;
  }
  .ask-card .topic-chips button.active { background: var(--accent-soft); color: var(--accent-strong); }
  .f-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  @media (max-width: 560px) { .f-grid { grid-template-columns: 1fr; } }
  .contact-hint { font-size:15px; color: var(--muted); margin-top: 10px; line-height: 1.6; }
  .ask-card button {
    align-self: flex-end; margin-top: 12px;
    border: none; background: var(--accent-soft); color: var(--accent-strong);
    font-size:17px; padding: 9px 22px; border-radius: 999px;
    cursor: pointer; transition: background .2s;
  }
  .ask-card button:hover { background: var(--accent, #FFD9E6); }
  .ask-card button:disabled { opacity: .5; cursor: default; }

  h2 { font-size:21px; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }
  h2::before { content: ""; width: 4px; height: 18px; background: var(--accent-soft, #FCE4EC); border-radius: 2px; }

  .qa {
    background: #fff;
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 2px 10px rgba(180,120,150,.12);
  }
  .qa-q { font-size:17px; white-space: pre-wrap; word-break: break-word; }
  .qa-meta { font-size:15px; color: var(--muted); margin-top: 8px; }
  .qa-reply {
    margin-top: 12px;
    background: #FFF8FA;
    border: 1px solid #FFD9E6;
    border-radius: 12px;
    padding: 12px 14px;
    font-size:17px;
    white-space: pre-wrap; word-break: break-word;
  }
  .qa-reply .reply-label { font-size:15px; color:var(--text,#604C57); font-weight: 600; display: block; margin-bottom: 4px; }
  .qa-pending { margin-top: 12px; font-size:16px; color: var(--muted); font-style: italic; }
  .empty { text-align: center; color: var(--muted); font-size:17px; padding: 30px 0; }

  .toast {
    position: fixed; bottom: 32px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text); color: #fff;
    font-size:17px; padding: 10px 22px;
    border-radius: 999px; opacity: 0;
    transition: opacity .25s, transform .25s;
    z-index: 400; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  footer {
    text-align: center;
    color: var(--muted);
    font-size:15px;
    padding: 24px 0 40px;
  }

  @media (max-width: 400px) {
    .lang-btn { padding: 4px 8px; }
    .topbar { padding: 0 10px; }

<script>
  var SUPABASE_URL = 'https://vmmmuyxrsiufzurwbydg.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZtbW11eXhyc2l1Znp1cndieWRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4NzM2NTAsImV4cCI6MjEwODQ0OTY1MH0.SbdbAJV5hP3MtyZxf7DQUAD9Fm-XNlVC5PaYf47lzsw';

  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function () { t.classList.remove('show'); }, 2200);
  }

  function api(path, options) {
    options = options || {};
    options.headers = Object.assign({
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
      'Content-Type': 'application/json'
    }, options.headers || {});
    return fetch(SUPABASE_URL + '/rest/v1/' + path, options);
  }

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }

  function fmtTime(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (LANG === 'en') return (d.getMonth() + 1) + '/' + d.getDate();
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  // ===== 中英双语切换（与主页联动）=====
  var LANG = 'zh';
  try { history.scrollRestoration = 'manual'; } catch (err) {} // 刷新/切语言/logo 回主页都从页面顶部开始
  try { LANG = localStorage.getItem('yuki-lang') || 'zh'; } catch (err) {}
  function t(zh, en) { return LANG === 'en' ? en : zh; }
  function applyLang(lang) {
    LANG = lang;
    document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
    document.querySelectorAll('[data-zh][data-en]').forEach(function (node) {
      node.textContent = lang === 'en' ? node.getAttribute('data-en') : node.getAttribute('data-zh');
    });
    document.querySelectorAll('[data-ph-zh]').forEach(function (node) {
      node.placeholder = lang === 'en' ? node.getAttribute('data-ph-en') : node.getAttribute('data-ph-zh');
    });
    document.querySelectorAll('.lang-btn').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-lang') === lang);
    });
    try { localStorage.setItem('yuki-lang', lang); } catch (err) {}
    loadWall();
  }
  document.querySelectorAll('.lang-btn').forEach(function (b) {
    b.addEventListener('click', function () {
      var lang = b.getAttribute('data-lang') === 'en' ? 'en' : 'zh';
      try { localStorage.setItem('yuki-lang', lang); } catch (err) {}
      location.reload(); // 保存后整页刷新：从已存语言状态重新初始化，URL 保持不变
    });
  });

  // 汉堡菜单：全站统一组件 site-menu.js 负责渲染与交互

  // 联系主题切换（站内自定义胶囊，不用原生 select）
  var TOPIC = 'product';
  var TOPIC_ZH = { product: '商品咨询', order: '订单问题', aftersale: '售后与退款', site: '网站问题', other: '其他' };
  var TOPIC_EN = { product: 'Product', order: 'Order', aftersale: 'After-sales', site: 'Website', other: 'Other' };
  document.getElementById('topic-chips').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    TOPIC = b.getAttribute('data-v') || 'product';
    Array.prototype.forEach.call(this.children, function (x) { x.classList.toggle('active', x === b); });
  });

  // 回复方式切换：匿名 / 留下联系方式
  var REPLY_MODE = 'anon';
  var MODE_HINTS = {
    anon: { zh: '匿名留言不会记录任何联系方式；柚子的回复会显示在下方留言墙。', en: "Anonymous messages record no contact info; Yuki's replies are posted on the wall below." },
    contact: { zh: '你提供的联系方式仅用于处理和回复这条留言，不会公开展示。', en: 'Your contact info is only used to handle and reply to this message and is never shown publicly.' }
  };
  document.getElementById('mode-chips').addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    this.querySelectorAll('button').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    REPLY_MODE = btn.getAttribute('data-v');
    document.getElementById('contact-fields').style.display = (REPLY_MODE === 'contact') ? '' : 'none';
    var h = MODE_HINTS[REPLY_MODE];
    document.getElementById('mode-hint').innerHTML = '<span data-zh="' + h.zh + '" data-en="' + h.en + '">' + t(h.zh, h.en) + '</span>';
  });
  // 提交留言
  document.getElementById('q-send').addEventListener('click', function () {
    var btn = this;
    if (document.getElementById('q-honey').value) { return; } // 蜜罐字段：机器人填了就静默丢弃，不提示不写库
    var text = document.getElementById('q-text').value.trim();
    var nickname = REPLY_MODE === 'contact' ? document.getElementById('q-nickname').value.trim() : '';
    var email = REPLY_MODE === 'contact' ? document.getElementById('q-email').value.trim() : '';
    var other = REPLY_MODE === 'contact' ? document.getElementById('q-other').value.trim() : '';
    if (!text) { toast(t('先写点什么再提交哦', 'Write something first')); return; }
    if (REPLY_MODE === 'contact' && !nickname && !email && !other) {
      toast(t('选了留下联系方式的话，至少填一种哦；不想留可以切回匿名留言', 'Pick “Leave Contact Info”? Fill in at least one — or switch back to Anonymous')); return;
    }
    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { toast(t('Email 格式好像不太对', 'That email looks invalid')); return; }
    try { // 防刷：30 秒内只允许提交一次
      var last = parseInt(localStorage.getItem('yuki-last-ask') || '0', 10);
      if (Date.now() - last < 30000) { toast(t('刚刚已经提交过啦，稍等一下再发', 'Just sent one — please wait a moment')); return; }
    } catch (err) {}
    var hasContact = !!(nickname || email || other);
    btn.disabled = true;
    btn.textContent = t('提交中…', 'Sending…');
    // 走服务端 RPC（security definer）：一次事务写留言+联系方式，并返回新留言 id；
    // 不能用 REST 直插 + Prefer:return=representation（公开读策略只放行已回复行，新行回读会被拒，这是旧提问箱“提交失败”的老 bug）
    api('rpc/askbox_submit', {
      method: 'POST',
      body: JSON.stringify({
        p_content: text,
        p_topic: TOPIC,
        p_nickname: nickname || null,
        p_email: email || null,
        p_other_contact: other || null
      })
    }).then(function (r) {
      if (!r.ok) throw new Error('rpc failed');
      return r.json();
    }).then(function (newId) {
      // 记住本机发出去的留言（匿名不绑账号，只在本机「发出去的留言」里展示）
      try {
        if (newId) {
          var ids = JSON.parse(localStorage.getItem('yuki-my-questions') || '[]');
          if (Array.isArray(ids) && ids.indexOf(newId) === -1) { ids.push(newId); localStorage.setItem('yuki-my-questions', JSON.stringify(ids.slice(-100))); }
        }
      } catch (e) {}
    }).then(function () {
      try { localStorage.setItem('yuki-last-ask', String(Date.now())); } catch (err) {}
      toast(hasContact
        ? t('提交成功！柚子会尽快回复你', 'Sent! Yuki will get back to you soon')
        : t('提交成功！由于没有留联系方式，回复会显示在下方留言墙', 'Sent! Replies will be posted on the wall below'));
      document.getElementById('q-text').value = '';
      document.getElementById('q-nickname').value = '';
      document.getElementById('q-email').value = '';
      document.getElementById('q-other').value = '';
      loadWall();
    }).catch(function () {
      toast(t('提交失败，稍后再试试', 'Failed to send, please try again later'));
    }).finally(function () {
      btn.disabled = false;
      btn.innerHTML = '<span data-zh="提交留言" data-en="Send Message">' + t('提交留言', 'Send Message') + '</span>';
    });
  });

  // 回答墙
  function loadWall() {
    api('questions?select=id,content,topic,reply,created_at,replied_at&order=created_at.desc&limit=100')
      .then(function (r) { return r.json(); })
      .then(function (rows) {
        var list = document.getElementById('qa-list');
        if (!rows || !rows.length) {
          list.innerHTML = '<p class="empty">' + t('还没有人投递，来做第一个吧', 'No messages yet — be the first!') + '</p>';
          return;
        }
        list.innerHTML = rows.map(function (q) {
          var topic = t(TOPIC_ZH[q.topic] || TOPIC_ZH.other, TOPIC_EN[q.topic] || TOPIC_EN.other);
          var replyHtml = q.reply
            ? '<div class="qa-reply"><span class="reply-label">' + t('柚子 回复：', 'Yuki replied:') + '</span>' + esc(q.reply) + '</div>'
            : '<div class="qa-pending">' + t('已收到，等柚子回复哦～', 'Received! Yuki will reply soon~') + '</div>';
          return '<div class="qa">' +
            '<div class="qa-q">' + esc(q.content) + '</div>' +
            '<div class="qa-meta">' + t('主题：', 'Topic: ') + esc(topic) + ' · ' + t('匿名', 'Anonymous') + ' · ' + fmtTime(q.created_at) + '</div>' +
            replyHtml + '</div>';
        }).join('');
      })
      .catch(function () {
        document.getElementById('qa-list').innerHTML =
          '<p class="empty">' + t('加载失败，请稍后刷新重试', 'Failed to load, please refresh') + '</p>';
      });
  }
  applyLang(LANG);
  loadWall();
</script>
