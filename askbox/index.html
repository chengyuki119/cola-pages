<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>匿名提问箱 · Yuki / 柚子</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="/icon-yuki-180.png">
<link rel="icon" type="image/png" sizes="180x180" href="/icon-yuki-180.png">
<meta name="apple-mobile-web-app-title" content="小柚的小世界">
<style>
  :root {
    --bg: #fffcfd;
    --card: #fff2f7;
    --card-hover: #ffe7f0;
    --text: #5d6780;
    --muted: #9aa5bd;
    --accent: #ff6fa5;
    --accent-soft: #ffc8d6;
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
    padding-top: 60px; /* 避开固定顶栏 */
  }

  /* ===== 顶部白色长条 + 汉堡菜单（与主页一致）===== */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 60px;
    background: #ffffff;
    box-shadow: 0 2px 12px rgba(255,143,171,.18);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
  }
  .lang-switch {
    display: flex;
    gap: 4px;
    background: var(--card);
    padding: 4px;
    border-radius: 999px;
  }
  .lang-btn {
    border: none;
    background: transparent;
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 999px;
    cursor: pointer;
    color: var(--muted);
    transition: background .2s, color .2s;
  }
  .lang-btn.active { background: var(--accent-soft); color: #fff; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 48px 24px 64px; }
  .back-link {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--text);
    font-size: 14px;
    padding: 8px 14px; border-radius: 999px;
    background: var(--card);
    transition: background .2s;
  }
  .back-link:hover { background: var(--card-hover); }
  h1 { font-size: 26px; margin: 20px 0 6px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }

  .ask-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 18px;
    display: flex; flex-direction: column;
    margin-bottom: 40px;
  }
  .ask-card textarea {
    width: 100%; min-height: 110px;
    border: none; border-radius: 12px;
    background: #fff; padding: 12px 14px;
    font-family: inherit; font-size: 14px;
    color: var(--text); line-height: 1.6;
    resize: vertical; outline: none;
  }
  .ask-card textarea::placeholder { color: var(--muted); }
  .ask-card input {
    margin-top: 10px;
    border: none; border-radius: 12px;
    background: #fff; padding: 10px 14px;
    font-family: inherit; font-size: 13px;
    color: var(--text); outline: none;
  }
  .ask-card input::placeholder { color: var(--muted); }
  .contact-hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .ask-card button {
    align-self: flex-end; margin-top: 12px;
    border: none; background: var(--accent-soft); color: #fff;
    font-size: 14px; padding: 9px 22px; border-radius: 999px;
    cursor: pointer; transition: opacity .2s;
  }
  .ask-card button:hover { opacity: .85; }
  .ask-card button:disabled { opacity: .5; cursor: default; }

  h2 { font-size: 18px; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }
  h2::before { content: ""; width: 4px; height: 18px; background: var(--accent); border-radius: 2px; }

  .qa {
    background: #fff;
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 2px 10px rgba(180,120,150,.12);
  }
  .qa-q { font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .qa-meta { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .qa-reply {
    margin-top: 12px;
    background: var(--card);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 14px;
    white-space: pre-wrap; word-break: break-word;
  }
  .qa-reply .reply-label { font-size: 12px; color: var(--accent); font-weight: 600; display: block; margin-bottom: 4px; }
  .qa-pending { margin-top: 12px; font-size: 13px; color: var(--muted); font-style: italic; }
  .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 30px 0; }

  .toast {
    position: fixed; bottom: 32px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text); color: #fff;
    font-size: 14px; padding: 10px 22px;
    border-radius: 999px; opacity: 0;
    transition: opacity .25s, transform .25s;
    z-index: 400; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 24px 0 40px;
  }

  @media (max-width: 400px) {
    .lang-btn { padding: 4px 8px; }
    .topbar { padding: 0 10px; }
  }
</style>
  <link rel="stylesheet" href="/site-menu.css">
  <script src="/site-menu.js" defer></script>
  <style>a { color: inherit; text-decoration: none; }</style>
</head>
<body>
<header class="topbar">
  <div class="lang-switch">
    <button class="lang-btn" data-lang="zh">简体中文</button>
    <button class="lang-btn" data-lang="en">English</button>
  </div>
  <a class="site-logo" href="/" aria-label="回主页"><img src="/logo.png" alt="logo"></a>
  <button class="burger" id="burger" aria-label="菜单">
    <span></span><span></span><span></span>
  </button>
</header>
<div class="menu-mask" id="menu-mask"></div>
<nav class="menu" id="menu"></nav>

<div class="wrap">
  <a class="back-link" href="/" data-zh="← 返回主页" data-en="← Back to Home">← 返回主页</a>
  <h1><span data-zh="匿名提问箱" data-en="Anonymous Q&A Box">匿名提问箱</span></h1>
  <p class="sub"><span data-zh="悄悄问我任何话，完全匿名 · 柚子的回复会显示在下面" data-en="Ask me anything, totally anonymous · Yuki's replies are posted below">悄悄问我任何话，完全匿名 · 柚子的回复会显示在下面</span></p>

  <div class="ask-card">
    <textarea id="q-text" maxlength="1000" data-ph-zh="在这里写下想问的、想说的…（完全匿名哦）" data-ph-en="Write whatever you want to ask or say… (totally anonymous)"></textarea>
    <input id="q-contact" maxlength="200" data-ph-zh="想被回复到的话，可以留个联系方式（选填，只有柚子能看到）" data-ph-en="Leave a contact if you want a reply back (optional, only Yuki can see it)">
    <p class="contact-hint"><span data-zh="联系方式不会公开显示，只有柚子本人在后台能看到" data-en="Your contact is never shown publicly — only Yuki can see it in her dashboard">联系方式不会公开显示，只有柚子本人在后台能看到</span></p>
    <button id="q-send"><span data-zh="匿名投递" data-en="Send anonymously">匿名投递</span></button>
  </div>

  <h2><span data-zh="柚子的回答墙" data-en="Yuki's Answer Wall">柚子的回答墙</span></h2>
  <div id="qa-list"><p class="empty">加载中…</p></div>
</div>

<div class="toast" id="toast"></div>

<script>
  var SUPABASE_URL = 'https://zajcglvlzsolygvjeumb.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InphamNnbHZsenNvbHlndmpldW1iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMzI4NjUsImV4cCI6MjEwNjgwODg2NX0.7_Pthb3wPInb5v4o7IoWejozEvDZQgNPS8DgwikQ8ys';

  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function () { t.classList.remove('show'); }, 2200);
  }

  function api(path, options) {
    options = options || {};
    options.headers = Object.assign({
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
      'Content-Type': 'application/json'
    }, options.headers || {});
    return fetch(SUPABASE_URL + '/rest/v1/' + path, options);
  }

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }

  function fmtTime(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (LANG === 'en') return (d.getMonth() + 1) + '/' + d.getDate();
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  // ===== 中英双语切换（与主页联动）=====
  var LANG = 'zh';
  try { LANG = localStorage.getItem('yuki-lang') || 'zh'; } catch (err) {}
  function t(zh, en) { return LANG === 'en' ? en : zh; }
  function applyLang(lang) {
    LANG = lang;
    document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
    document.querySelectorAll('[data-zh][data-en]').forEach(function (node) {
      node.textContent = lang === 'en' ? node.getAttribute('data-en') : node.getAttribute('data-zh');
    });
    document.querySelectorAll('[data-ph-zh]').forEach(function (node) {
      node.placeholder = lang === 'en' ? node.getAttribute('data-ph-en') : node.getAttribute('data-ph-zh');
    });
    document.querySelectorAll('.lang-btn').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-lang') === lang);
    });
    try { localStorage.setItem('yuki-lang', lang); } catch (err) {}
    loadWall();
  }
  document.querySelectorAll('.lang-btn').forEach(function (b) {
    b.addEventListener('click', function () {
      var lang = b.getAttribute('data-lang') === 'en' ? 'en' : 'zh';
      try { localStorage.setItem('yuki-lang', lang); } catch (err) {}
      location.reload(); // 保存后整页刷新：从已存语言状态重新初始化，URL 保持不变
    });
  });

  // 汉堡菜单：全站统一组件 site-menu.js 负责渲染与交互

  // 投递提问
  document.getElementById('q-send').addEventListener('click', function () {
    var btn = this;
    var text = document.getElementById('q-text').value.trim();
    var contact = document.getElementById('q-contact').value.trim();
    if (!text) { toast(t('先写点什么再投递哦', 'Write something first')); return; }
    btn.disabled = true;
    btn.textContent = t('投递中…', 'Sending…');
    api('questions?select=id', {
      method: 'POST',
      headers: { 'Prefer': 'return=representation' },
      body: JSON.stringify({ content: text })
    }).then(function (r) {
      if (!r.ok) throw new Error('insert failed');
      return r.json();
    }).then(function (rows) {
      if (contact && rows && rows[0] && rows[0].id) {
        return api('contacts', {
          method: 'POST',
          body: JSON.stringify({ question_id: rows[0].id, contact: contact })
        });
      }
    }).then(function () {
      toast(t('投递成功！柚子会看到你的悄悄话', 'Sent! Yuki will see your message'));
      document.getElementById('q-text').value = '';
      document.getElementById('q-contact').value = '';
      loadWall();
    }).catch(function () {
      toast(t('投递失败，稍后再试试', 'Failed to send, please try again later'));
    }).finally(function () {
      btn.disabled = false;
      btn.innerHTML = '<span data-zh="匿名投递" data-en="Send anonymously">' + t('匿名投递', 'Send anonymously') + '</span>';
    });
  });

  // 回答墙
  function loadWall() {
    api('questions?select=id,content,reply,created_at,replied_at&order=created_at.desc&limit=100')
      .then(function (r) { return r.json(); })
      .then(function (rows) {
        var list = document.getElementById('qa-list');
        if (!rows || !rows.length) {
          list.innerHTML = '<p class="empty">' + t('还没有人投递，来做第一个吧', 'No messages yet — be the first!') + '</p>';
          return;
        }
        list.innerHTML = rows.map(function (q) {
          var replyHtml = q.reply
            ? '<div class="qa-reply"><span class="reply-label">' + t('柚子 回复：', 'Yuki replied:') + '</span>' + esc(q.reply) + '</div>'
            : '<div class="qa-pending">' + t('已收到，等柚子回复哦～', 'Received! Yuki will reply soon~') + '</div>';
          return '<div class="qa">' +
            '<div class="qa-q">' + esc(q.content) + '</div>' +
            '<div class="qa-meta">' + t('匿名', 'Anonymous') + ' · ' + fmtTime(q.created_at) + '</div>' +
            replyHtml + '</div>';
        }).join('');
      })
      .catch(function () {
        document.getElementById('qa-list').innerHTML =
          '<p class="empty">' + t('加载失败，请稍后刷新重试', 'Failed to load, please refresh') + '</p>';
      });
  }
  applyLang(LANG);
  loadWall();
</script>
<footer>© 2026 Yuki · Made with Cola</footer>
</body>
</html>
